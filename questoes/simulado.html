opaga os dados por 3 etapas de tempo. Calcule A³ usando D³, sem multiplicar A três vezes, e confira multiplicando A²·A.\n(e) Qual direção carrega mais informação estrutural e que fração da variância total ela representa?", "expl": "**(a)** A − λI = [[7 − λ, 2], [2, 4 − λ]]. det = (7 − λ)(4 − λ) − 4 = λ² − 11λ + 24 = 0 → (λ − 8)(λ − 3) = 0 → **λ₁ = 8, λ₂ = 3**.\n\n**(b)** λ = 8: [[−1, 2], [2, −4]] → −x + 2y = 0 → x = 2y → **v₁ = (2, 1)**. λ = 3: [[4, 2], [2, 1]] → 2x + y = 0 → y = −2x → **v₂ = (1, −2)**.\n\n**(c)** P = [[2, 1], [1, −2]]; D = diag(8, 3); det(P) = −5 → P⁻¹ = (1/−5)·[[−2, −1], [−1, 2]] = [[0,4, 0,2], [0,2, −0,4]].\n\n**(d)** D³ = diag(512, 27). P·D³ = [[1024, 27], [512, −54]]. A³ = P·D³·P⁻¹ = **[[415, 194], [194, 124]]**. Conferindo: A² = [[53, 22], [22, 20]]; A²·A = [[53·7 + 22·2, 53·2 + 22·4], [22·7 + 20·2, 22·2 + 20·4]] = [[415, 194], [194, 124]].\n\n**(e)** A direção de v₁ = (2, 1), com λ = 8, carrega mais informação: 8/(8 + 3) ≈ **72,7%** da variância total (8 é 8/3 ≈ 2,7 vezes o autovalor 3). Na prática, manter só essa projeção reduz dimensionalidade perdendo pouca informação.", "type": "open"}, {"id": "p3q22", "n": 22, "subj": "prog", "tag": "Limiar, ROC e SHAP", "pts": 10, "stem": "Um classificador de risco de crédito devolve a probabilidade de inadimplência. Com limiar 0,5, em 500 clientes de teste (positivo = inadimplente) obteve-se: TP = 60, FP = 40, FN = 20 e TN = 380.\n\n(a) Calcule acurácia, precisão, recall, especificidade e F1.\n(b) Calcule TPR e FPR desse ponto e explique o que a curva ROC e a AUC representam. Por que a curva usa `predict_proba` e não `predict`?\n(c) O banco considera pior aprovar um mau pagador do que recusar um bom. O que a equipe deve fazer com o limiar e o que muda em precisão e recall? Compare com um cenário em que o pior erro seria o oposto.\n(d) Para um cliente, o SHAP tem valor base 0,20 e contribuições +0,30 (atrasos anteriores), +0,15 (renda comprometida) e −0,10 (tempo de conta). Qual é a probabilidade prevista? Por que essa explicação difere da importância global das variáveis?", "expl": "**(a)** Acurácia = (60 + 380)/500 = **0,88**. Precisão = 60/(60 + 40) = **0,60**. Recall = 60/(60 + 20) = **0,75**. Especificidade = 380/(380 + 40) ≈ **0,905**. F1 = 2·0,60·0,75/(0,60 + 0,75) ≈ **0,667**.\n\n**(b)** TPR (recall) = 0,75; FPR = FP/(FP + TN) = 40/420 ≈ **0,095**. Esse é um ponto da ROC. A curva mostra TPR × FPR para todos os limiares; a AUC resume tudo em um número (0,5 = aleatório; 1,0 = separação perfeita). A curva precisa de um **score contínuo** (`predict_proba`, probabilidade da classe positiva); `predict` já aplica um limiar e devolve só a classe.\n\n**(c)** O falso negativo (mau pagador aprovado) é o erro mais grave, então prioriza-se o **recall**: reduz-se o limiar (por exemplo, 0,5 → 0,3), o que diminui os FN, aumenta os FP e portanto **reduz a precisão** (trade-off). Se o pior erro fosse o oposto (recusar um bom cliente e perdê-lo), priorizaria-se a **precisão**, elevando o limiar.\n\n**(d)** Previsão = 0,20 + 0,30 + 0,15 − 0,10 = **0,55**. O SHAP explica **uma previsão individual** (valor base + soma das contribuições = previsão), mostrando por que este cliente foi sinalizado. A importância global só indica o peso médio das variáveis no modelo inteiro.", "type": "open"}]}]</script>

function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* figura: boxplot */
function niceStep(range){var c=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,10000];for(var i=0;i<c.length;i++){if(range/c[i]<=8)return c[i]}return 10000}
function boxFig(spec){
  var parts=spec.split("|"),label=parts[0],boxes=parts.slice(1).map(function(b){var p=b.split(",");return{n:p[0],min:+p[1],q1:+p[2],md:+p[3],q3:+p[4],max:+p[5],out:(p[6]?p[6].split(";").map(Number):[])}});
  var lo=Math.min.apply(null,boxes.map(function(b){return b.min})),hi=Math.max.apply(null,boxes.map(function(b){return Math.max.apply(null,[b.max].concat(b.out))}));
  var step=niceStep(hi-lo);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  var W=Math.max(340,110+boxes.length*130),H=260,L=58,T=16,B=44,R=16,pw=W-L-R,ph=H-T-B;
  function y(v){return T+ph-(v-lo)/(hi-lo)*ph}
  var g="";for(var v=lo;v<=hi+1e-9;v+=step){g+="<line class=grid x1="+L+" x2="+(W-R)+" y1="+y(v)+" y2="+y(v)+"></line><text x="+(L-8)+" y="+(y(v)+4)+" text-anchor=end>"+v+"</text>"}
  var cw=pw/boxes.length,bw=Math.min(70,cw*.5),s="";
  boxes.forEach(function(b,i){var cx=L+cw*(i+.5);
    s+="<line class=ln x1="+cx+" x2="+cx+" y1="+y(b.max)+" y2="+y(b.q3)+"></line><line class=ln x1="+cx+" x2="+cx+" y1="+y(b.q1)+" y2="+y(b.min)+"></line>";
    s+="<line class=ln x1="+(cx-bw/4)+" x2="+(cx+bw/4)+" y1="+y(b.max)+" y2="+y(b.max)+"></line><line class=ln x1="+(cx-bw/4)+" x2="+(cx+bw/4)+" y1="+y(b.min)+" y2="+y(b.min)+"></line>";
    s+="<rect class=bx x="+(cx-bw/2)+" y="+y(b.q3)+" width="+bw+" height="+(y(b.q1)-y(b.q3))+"></rect><line class=md x1="+(cx-bw/2)+" x2="+(cx+bw/2)+" y1="+y(b.md)+" y2="+y(b.md)+"></line>";
    b.out.forEach(function(o){s+="<circle class=ot cx="+cx+" cy="+y(o)+" r=4></circle>"});
    s+="<text class=lbl x="+cx+" y="+(H-B+20)+" text-anchor=middle>"+esc(b.n)+"</text>"});
  s+="<text x="+L+" y=11>"+esc(label)+"</text>";
  return "<div class=fig role=img aria-label=\"Boxplot de "+esc(label)+"\"><svg viewBox=\"0 0 "+W+" "+H+"\" width="+W+">"+g+s+"</svg></div>";
}

/* markdown mínimo */
function inline(s){
  var codes=[];
  s=esc(s).replace(/`([^`]+)`/g,function(_,c){codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  return s.replace(/\u0000(\d+)\u0000/g,function(_,i){return "<code>"+codes[i]+"</code>"});
}
function md(src){
  var lines=src.split("\n"),out=[],i=0,para=[];
  function flush(){if(para.length){out.push("<p>"+para.map(inline).join("<br>")+"</p>");para=[]}}
  while(i<lines.length){
    var l=lines[i],m;
    if(/^```/.test(l)){flush();var buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++}i++;out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");continue}
    if((m=l.match(/^\{\{box:(.+)\}\}\s*$/))){flush();out.push(boxFig(m[1]));i++;continue}
    if(/^\|/.test(l)){flush();var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++}
      var h="<div class=scroll><table>";rows.forEach(function(r,ix){if(/^\|[\s:|-]+\|$/.test(r))return;var c=r.replace(/^\||\|$/g,"").split("|");var tg=ix===0?"th":"td";h+="<tr>"+c.map(function(x){return "<"+tg+">"+inline(x.trim())+"</"+tg+">"}).join("")+"</tr>"});
      out.push(h+"</table></div>");continue}
    if(/^\s*-\s+/.test(l)){flush();var li=[];while(i<lines.length&&/^\s*-\s+/.test(lines[i])){li.push("<li>"+inline(lines[i].replace(/^\s*-\s+/,""))+"</li>");i++}out.push("<ul>"+li.join("")+"</ul>");continue}
    if(/^\s*$/.test(l)){flush();i++;continue}
    para.push(l.trim());i++;
  }
  flush();return out.join("");
}

/* estado */
function get(q){return st.ans[q.id]||(st.ans[q.id]={})}
function status(q){var a=st.ans[q.id];if(!a)return null;if(q.type==="open")return a.grade||null;return a.done?a.res:null}
function pts(q){var s=status(q);return q.pts*(s==="ok"?1:s==="mid"?.5:0)}
function prova(){return PROVAS.filter(function(s){return s.id===st.tab})[0]}
function stats(p){var d=0,pt=0;p.q.forEach(function(q){if(status(q)){d++;pt+=pts(q)}});return{d:d,pt:pt}}
function fmt(n){return (Math.round(n*10)/10).toString().replace(".",",")}

/* cabeçalho */
function renderHead(){
  var p=prova(),x=stats(p);
  $("ovBar").style.width=(x.d/p.q.length*100)+"%";
  $("ovTxt").textContent=x.d+" de "+p.q.length+" feitas · "+fmt(x.pt)+" pts";
  var t=$("tabs");t.innerHTML="";
  PROVAS.forEach(function(s){
    var y=stats(s),b=document.createElement("button");b.type="button";b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",s.id===st.tab);
    b.innerHTML="<b>"+s.name+"</b><small>"+y.d+"/"+s.q.length+" · "+fmt(y.pt)+" de 100 pts</small><div class=bar><i style=\"width:"+(y.d/s.q.length*100)+"%\"></i></div>";
    b.onclick=function(){st.tab=s.id;save();renderAll();window.scrollTo({top:0})};
    t.appendChild(b);
  });
}
function renderChips(){
  var p=prova(),c=$("chips");c.innerHTML="";c.style.setProperty("--c","var(--tabc)");
  var f=[["all","Todas"],["mat","Matemática"],["prog","Programação"],["lid","Liderança"],["neg","Negócios"],["des","Design"],["pend","Pendentes"],["bad","Erradas"]];
  f.forEach(function(k){
    var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=k[1];b.setAttribute("aria-pressed",st.filter===k[0]);
    b.onclick=function(){st.filter=k[0];save();renderChips();renderList()};c.appendChild(b);
  });
  var idx=+p.id.slice(1)-1;
  $("intro").innerHTML="<strong>"+p.name+"</strong> · "+INTRO[idx];
}

/* cartões */
function renderList(){
  var p=prova(),list=$("list");list.innerHTML="";
  var x=stats(p);
  var sb=document.createElement("div");sb.className="scorebox";
  sb.innerHTML="<b>"+fmt(x.pt)+"</b><span>de 100 pontos · "+x.d+"/"+p.q.length+" respondidas"+(x.d===p.q.length?" · prova concluída":"")+"</span>";
  list.appendChild(sb);
  var qs=p.q.filter(function(q){
    var s=status(q);
    if(st.filter==="all")return true;
    if(st.filter==="pend")return !s;
    if(st.filter==="bad")return s==="bad"||s==="mid";
    return q.subj===st.filter;
  });
  if(!qs.length){var e=document.createElement("div");e.className="empty";e.textContent="Nada por aqui neste filtro.";list.appendChild(e);return}
  qs.forEach(function(q){list.appendChild(card(q))});
}
function card(q){
  var a=get(q),x=status(q),el=document.createElement("article");
  el.className="card"+(x?" done-"+x:"");el.style.setProperty("--c","var(--"+q.subj+")");el.id=q.id;
  el.innerHTML="<div class=qhead><span class=num>"+q.n+"</span><span class=tag>"+SN[q.subj]+" · "+esc(q.tag)+"</span><span class=pts>"+(q.type==="open"?"Discursiva":"Objetiva")+" · "+q.pts+" pts</span></div><div class=stem>"+md(q.stem)+"</div>";
  var body=document.createElement("div");body.style.display="grid";body.style.gap="12px";el.appendChild(body);
  if(q.type==="mc")mcBody(q,a,body);else openBody(q,a,body);
  return el;
}
function redo(q){delete st.ans[q.id];save();renderHead();renderList()}
function fbHTML(cls,verdict,expl){return "<div class=\"fb "+cls+"\"><div class=verdict>"+verdict+"</div><div class=expl>"+md(expl)+"</div><div><button type=button class=ghost data-redo>Refazer</button></div></div>"}
function mcBody(q,a,body){
  var box=document.createElement("div");box.className="opts";
  q.options.forEach(function(o){
    var b=document.createElement("button");b.type="button";b.className="opt";
    b.innerHTML="<span class=k>"+o[0]+"</span><span class=t>"+inline(o[1])+"</span>";
    if(a.done){b.disabled=true;if(o[0]===q.answer)b.classList.add("right");else if(o[0]===a.sel)b.classList.add("wrong");else b.classList.add("dim")}
    b.onclick=function(){a.sel=o[0];a.done=true;a.res=(o[0]===q.answer)?"ok":"bad";save();renderHead();renderList();var e=document.getElementById(q.id);if(e&&e.scrollIntoView)e.scrollIntoView({block:"nearest"})};
    box.appendChild(b);
  });
  body.appendChild(box);
  if(a.done){var w=document.createElement("div");
    w.innerHTML=fbHTML(a.res==="ok"?"ok":"bad",a.res==="ok"?"Correto (+"+q.pts+" pts)":"Errou. A certa é a "+q.answer,q.expl);
    body.appendChild(w.firstChild);body.querySelector("[data-redo]").onclick=function(){redo(q)}}
}
function openBody(q,a,body){
  var ta=document.createElement("textarea");ta.id="ta-"+q.id;ta.placeholder="Escreva sua resposta aqui (fica salva neste navegador)";ta.value=a.text||"";ta.setAttribute("aria-label","Sua resposta à questão "+q.n);
  ta.oninput=function(){a.text=ta.value;save()};body.appendChild(ta);
  if(!a.shown){
    var r=document.createElement("div");r.className="row";r.innerHTML="<button type=button class=btn>Ver resposta-modelo</button>";
    r.querySelector("button").onclick=function(){a.shown=true;save();renderList()};body.appendChild(r);
  }else{
    var m=document.createElement("div");m.className="model";m.innerHTML="<h4>Resposta-modelo</h4><div class=expl>"+md(q.expl)+"</div>";body.appendChild(m);
    var g=document.createElement("div");g.className="row";
    g.innerHTML="<span class=sum>Como foi? (valem 10 pts)</span><div class=grade><button type=button class=\"g g-ok\" data-g=ok>Acertei</button><button type=button class=\"g g-mid\" data-g=mid>Metade</button><button type=button class=\"g g-bad\" data-g=bad>Errei</button></div><button type=button class=ghost data-redo>Refazer</button>";
    g.querySelectorAll(".g").forEach(function(b){b.setAttribute("aria-pressed",a.grade===b.dataset.g);b.onclick=function(){a.grade=b.dataset.g;save();renderHead();renderList()}});
    g.querySelector("[data-redo]").onclick=function(){redo(q)};body.appendChild(g);
  }
}
var armed=false,tm;
$("reset").onclick=function(){
  var b=$("reset");
  if(!armed){armed=true;b.textContent="Toque de novo para apagar tudo";tm=setTimeout(function(){armed=false;b.textContent="Zerar respostas"},3500);return}
  clearTimeout(tm);armed=false;b.textContent="Zerar respostas";st.ans={};save();renderAll();
};
function renderAll(){
  if(!prova())st.tab="p1";
  document.documentElement.style.setProperty("--accent","var(--tabc)");
  renderHead();renderChips();renderList();
}
renderAll();
})();
</script>
