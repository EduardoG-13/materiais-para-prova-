<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Simulado Prova Módulo 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cabeçalho fixo com progresso e abas por matéria; uma coluna de cartões de questão; cada matéria tem sua cor. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface2:#F7F9FC; --ink:#152033; --muted:#5A6779; --line:#DCE3EE;
  --ok:#137A3E; --ok-bg:#E4F5EA; --bad:#B4232C; --bad-bg:#FCE8E9; --warn:#9A5B00; --warn-bg:#FFF1D6;
  --mat:#4A48E0; --prog:#0B8F80; --lid:#C46A00; --neg:#8B2FD0; --des:#D6206B;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --code-bg:#EEF2F8; --tabc:#33415C;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141F; --surface:#171F2E; --surface2:#1C2537; --ink:#E8EDF6; --muted:#9AA7BC; --line:#2A3650;
  --ok:#5BD98C; --ok-bg:#12331F; --bad:#FF8087; --bad-bg:#3A1519; --warn:#F5B84E; --warn-bg:#3A2A0C;
  --mat:#8F8DFF; --prog:#35D0BF; --lid:#FFA84A; --neg:#C58BFF; --des:#FF6FA5; --code-bg:#0F1727; --tabc:#C9D5EE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141F; --surface:#171F2E; --surface2:#1C2537; --ink:#E8EDF6; --muted:#9AA7BC; --line:#2A3650;
  --ok:#5BD98C; --ok-bg:#12331F; --bad:#FF8087; --bad-bg:#3A1519; --warn:#F5B84E; --warn-bg:#3A2A0C;
  --mat:#8F8DFF; --prog:#35D0BF; --lid:#FFA84A; --neg:#C58BFF; --des:#FF6FA5; --code-bg:#0F1727; --tabc:#C9D5EE; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
.wrap{max-width:820px;margin-inline:auto;padding-inline:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent,var(--mat));outline-offset:2px}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
.overall{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;width:min(190px,34vw);border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent,var(--mat));border-radius:99px;transition:width .35s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:0 0 auto;display:grid;gap:5px;text-align:left;min-width:118px;padding:8px 12px 9px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);transition:border-color .15s,background .15s}
.tab b{font-family:var(--f-display);font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:7px}
.tab b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.tab small{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tab .bar{width:100%;height:5px}
.tab .bar>i{background:var(--c)}
.tab[aria-selected="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface))}

/* filtros */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-block:16px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
[data-theme="dark"] .chip[aria-pressed="true"]{color:#0E141F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0E141F}}
.ghost{background:none;border:0;color:var(--muted);font-size:.82rem;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.ghost.danger{color:var(--bad)}
.intro{margin:6px 0 4px;color:var(--muted);font-size:.9rem}
.intro strong{color:var(--ink)}

/* cartões */
.list{display:grid;gap:14px;padding-block:8px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;display:grid;gap:12px;min-width:0}
.card.done-ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.card.done-bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.card.done-mid{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{min-width:38px;height:38px;padding-inline:8px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
[data-theme="dark"] .num{color:#0E141F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .num{color:#0E141F}}
.tag{font-size:.8rem;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.kind{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.lvl{margin-left:auto;display:flex;align-items:flex-end;gap:3px;font-size:.75rem;color:var(--muted)}
.lvl i{width:5px;border-radius:2px;background:var(--line)}
.lvl i:nth-child(1){height:7px}.lvl i:nth-child(2){height:11px}.lvl i:nth-child(3){height:15px}
.lvl i.on{background:var(--c)}
.lvl span{margin-left:6px;align-self:center}
.stem{min-width:0;overflow-wrap:anywhere}
.stem p,.expl p{margin:0 0 .6em}.stem p:last-child,.expl p:last-child{margin:0}
.stem ul,.expl ul{margin:.3em 0;padding-left:1.2em}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:.1em .4em;border-radius:5px}
pre{margin:.4em 0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:.85rem;line-height:1.5}
pre code{background:none;padding:0;font-size:inherit;white-space:pre}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:.88rem;min-width:100%}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left}th{background:var(--surface2)}

/* alternativas */
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);min-width:0;transition:border-color .12s,background .12s}
.opt .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;border:1.5px solid var(--line);background:var(--surface);text-transform:uppercase}
.opt .t{overflow-wrap:anywhere;padding-top:3px}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
[data-theme="dark"] .opt.right .k,[data-theme="dark"] .opt.wrong .k{color:#0E141F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt.right .k,:root:not([data-theme="light"]) .opt.wrong .k{color:#0E141F}}

/* soma */
.soma{display:grid;gap:8px}
.st{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);text-align:left;width:100%;min-width:0}
.st .v{font-family:var(--f-mono);font-weight:600;font-size:.9rem;min-width:34px;height:30px;border-radius:9px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface)}
.st .t{overflow-wrap:anywhere;padding-top:3px}
.st[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.st[aria-pressed="true"] .v{background:var(--c);border-color:var(--c);color:#fff}
[data-theme="dark"] .st[aria-pressed="true"] .v{color:#0E141F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st[aria-pressed="true"] .v{color:#0E141F}}
.st.right{border-color:var(--ok);background:var(--ok-bg)}.st.wrong{border-color:var(--bad);background:var(--bad-bg)}
.st .mark{grid-column:2;font-size:.78rem;font-weight:600}
.st.right .mark{color:var(--ok)}.st.wrong .mark{color:var(--bad)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:11px;border:0;background:var(--c);color:#fff;font-weight:700}
[data-theme="dark"] .btn{color:#0E141F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E141F}}
.btn.sec{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.sum{font-family:var(--f-mono);font-size:.95rem;color:var(--muted)}
.sum b{color:var(--ink);font-size:1.1rem}

/* resposta aberta */
textarea{width:100%;min-height:96px;resize:vertical;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:.95rem;padding:10px 12px}
.grade{display:flex;gap:8px;flex-wrap:wrap}
.g{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600;font-size:.88rem}
.g[aria-pressed="true"].g-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.g[aria-pressed="true"].g-mid{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.g[aria-pressed="true"].g-bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

/* feedback */
.fb{border-radius:12px;padding:11px 13px;background:var(--surface2);border:1px solid var(--line);display:grid;gap:6px;font-size:.94rem}
.fb .verdict{font-weight:800;font-family:var(--f-display);font-size:1.02rem}
.fb.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}.fb.ok .verdict{color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}.fb.bad .verdict{color:var(--bad)}
.fb.mid{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}.fb.mid .verdict{color:var(--warn)}
.fb .expl{min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.model{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.model h4{margin:0 0 6px;font-family:var(--f-display);font-size:.95rem;color:var(--c)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){h1{font-size:1.25rem}.card{padding:14px 13px 12px}.lvl span{display:none}}

.pts{font-size:.75rem;color:var(--muted);font-family:var(--f-mono);margin-left:auto}
.fig{margin:.6em 0;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:8px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin-inline:auto;min-width:300px}
.fig text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.fig .grid{stroke:var(--line);stroke-width:1}
.fig .bx{stroke:var(--c);stroke-width:2;fill:color-mix(in srgb,var(--c) 14%,var(--surface))}
.fig .ln{stroke:var(--c);stroke-width:2;fill:none}
.fig .md{stroke:var(--ok);stroke-width:3}
.fig .ot{stroke:var(--c);stroke-width:2;fill:var(--surface)}
.fig .lbl{fill:var(--ink);font-size:12px}
.scorebox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);margin-bottom:4px}
.scorebox b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.scorebox span{color:var(--muted);font-size:.88rem}
.tab[aria-selected="true"]{border-color:var(--tabc);background:color-mix(in srgb,var(--tabc) 9%,var(--surface))}
.tab b::before{background:var(--tabc)}
.tab .bar>i{background:var(--tabc)}
.card .stem ol,.card .expl ol{margin:.3em 0;padding-left:1.4em}
</style>

</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="brand">
      <h1>Simulado Prova Módulo 3</h1>
      <div class="overall"><div class="bar" aria-hidden="true"><i id="ovBar"></i></div><span id="ovTxt"></span></div>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Matérias"></div>
  </div>
</header>
<main class="wrap">
  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="Filtro"></div>
    <button class="ghost danger" id="reset" type="button">Zerar respostas</button>
  </div>
  <p class="intro" id="intro"></p>
  <div class="list" id="list"></div>
</main>

<script id="data" type="application/json">[{"id": "p1", "name": "Prova 1", "q": [{"id": "p1q1", "n": 1, "subj": "lid", "tag": "Viés e IA", "pts": 4, "stem": "Uma fintech treinou um modelo de score de crédito com 10 anos de aprovações e reprovações feitas por analistas. Meses depois, uma auditoria mostrou que moradores de certos CEPs da periferia são reprovados com frequência muito maior, mesmo com renda equivalente à de outros grupos. A coluna \"raça\" nunca fez parte da base, mas o CEP sim. Com base na aula de Viés e IA e no autoestudo (Ferrara, 2024), avalie as afirmações:\n\nI. Rótulos herdados de decisões humanas passadas são uma fonte de viés de dados, pois o modelo aprende e reproduz padrões históricos.\n\nII. Como a coluna \"raça\" não está na base, é impossível que o modelo discrimine por raça, mesmo usando o CEP.\n\nIII. A IA pode \"industrializar\" o Sistema 1: um viés individual e intuitivo passa a ser sistemático e em escala.\n\nIV. Por ser um modelo estatístico que apenas calcula números, seu resultado é neutro e dispensa auditoria.\n\nEstão corretas:", "expl": "I é verdadeira (rótulos herdados são viés de dados). II é falsa: o CEP funciona como **proxy** de atributos sensíveis. III é verdadeira: 'a IA não elimina o Sistema 1, ela o industrializa'. IV é falsa: o algoritmo pode ser um Sistema 1 estatístico muito veloz, e o líder deve ser o Sistema 2 da organização (auditar, questionar, desacelerar).", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas I e III."], ["C", "Apenas II e IV."], ["D", "Apenas III e IV."], ["E", "Apenas I, II e III."]], "answer": "B"}, {"id": "p1q2", "n": 2, "subj": "des", "tag": "Jornada do usuário", "pts": 4, "stem": "No projeto de previsão de vendas da MAHLE, o grupo mapeou a jornada do planejador de demanda na revisão mensal da previsão (fases: Preparar, Analisar, Avaliar, Decidir), com ações, pensamentos, dores e oportunidades. Com base na aula de Jornada do Usuário e no autoestudo (NN/g, *Journey Mapping 101*), avalie:\n\nI. Um mapa de jornada representa um ator e um ponto de vista, com cenário e expectativas, fases, ações, pensamentos, emoções e oportunidades.\n\nII. Como o modelo é preditivo, a jornada se resume à tela do dashboard: a fase em que a pessoa decide com a previsão não faz parte do mapa.\n\nIII. Uma dor como \"incerteza sobre se posso confiar na previsão\" pode originar uma oportunidade de design, por exemplo, comunicar a margem de erro.\n\nIV. Para economizar tempo, o planejador de demanda e o diretor de operações devem ser representados no mesmo mapa.\n\nEstão corretas:", "expl": "I e III são verdadeiras. II é falsa: as perguntas da aula são 'em que momento a previsão entra?' e 'o que a pessoa precisa saber para decidir?', então a decisão faz parte da jornada. IV é falsa: 'um mapa = um ator + um ponto de vista'; duas personas exigem dois mapas.", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas II e IV."], ["C", "Apenas I e III."], ["D", "Apenas II e III."], ["E", "Apenas III e IV."]], "answer": "C"}, {"id": "p1q3", "n": 3, "subj": "des", "tag": "Escolha do gráfico", "pts": 4, "stem": "A engenharia da MAHLE quer investigar se existe relação entre a potência do motor (cv) e o consumo de combustível (km/l) de 200 modelos de veículos do catálogo, para alimentar o modelo preditivo. Qual gráfico é o mais adequado e como ele deve ser lido, segundo a aula de Design e Visualização de Dados?", "expl": "Relação entre duas variáveis quantitativas pede **dispersão**: uma observação, um ponto; não se ligam os pontos e relação não significa causalidade. Linha exige ordem real (tempo); histograma mostra a distribuição de uma variável; pizza serve para um todo com poucas categorias.", "type": "mc", "options": [["A", "Gráfico de dispersão, em que cada modelo é um ponto (potência no eixo X, consumo no eixo Y). Observam-se direção, concentração e pontos diferentes, sem concluir causalidade."], ["B", "Gráfico de linha, ligando os modelos em ordem de potência para mostrar a tendência de cada modelo ao longo do tempo."], ["C", "Gráfico de barras empilhadas, com uma barra por modelo dividida entre potência e consumo."], ["D", "Histograma, com uma barra por modelo cuja altura é o consumo."], ["E", "Gráfico de pizza, com uma fatia para cada faixa de potência."]], "answer": "A"}, {"id": "p1q4", "n": 4, "subj": "neg", "tag": "LGPD", "pts": 4, "stem": "Uma empresa de telemetria veicular coleta, por um aplicativo, dados de localização de motoristas com o objetivo declarado de prever a demanda por peças de reposição. Meses depois, o mesmo conjunto passa a ser vendido a anunciantes, sem aviso aos titulares. Considerando os princípios da LGPD (arts. 6º e 7º) trabalhados na aula de LGPD e política de dados, qual princípio foi diretamente violado?", "expl": "Finalidade: 'o dado foi reunido para prever demanda; qualquer outro uso está fora'. Necessidade trata da quantidade de dados coletados, segurança das medidas técnicas; nenhuma delas descreve o desvio de propósito do caso.", "type": "mc", "options": [["A", "Segurança, pois faltou criptografia no aplicativo."], ["B", "Necessidade, pois foram coletados mais dados do que o modelo precisa."], ["C", "Livre acesso, pois o titular não pôde consultar seus dados."], ["D", "Finalidade, pois o tratamento deve ocorrer apenas para o propósito informado ao titular."], ["E", "Qualidade dos dados, pois a localização estava imprecisa."]], "answer": "D"}, {"id": "p1q5", "n": 5, "subj": "neg", "tag": "Governança de startups", "pts": 4, "stem": "A governança corporativa de startups evolui com o ciclo de vida da empresa. Associe as práticas (coluna 1) às fases em que aparecem como essenciais (coluna 2).\n\n**Coluna 1**\n1. Founders Agreement e definição de participações societárias\n2. Constituição formal, estatuto social e conselho consultivo inicial\n3. Conselho de Administração formal e comitês temáticos (auditoria, compliance)\n4. Conselho independente, auditoria externa e preparação para IPO ou M&A\n\n**Coluna 2**\n( ) Escala\n( ) Ideação\n( ) Tração\n( ) Validação", "expl": "Escala → 4; Ideação → 1; Tração → 3; Validação → 2. Ideação: Founders Agreement e código de conduta. Validação: constituição formal e conselho consultivo. Tração: conselho formal e comitês. Escala: conselho independente, auditoria externa e preparação para IPO/M&A.", "type": "mc", "options": [["A", "4 – 1 – 3 – 2"], ["B", "1 – 4 – 3 – 2"], ["C", "4 – 3 – 1 – 2"], ["D", "2 – 1 – 3 – 4"], ["E", "1 – 2 – 3 – 4"]], "answer": "A"}, {"id": "p1q6", "n": 6, "subj": "neg", "tag": "Cultura e mudança", "pts": 4, "stem": "A MAHLE decide majoritariamente por experiência, não por evidência. O modelo preditivo de demanda só gera valor se for adotado, e o time que hoje faz a previsão manualmente teme perder competência e status. Segundo Schein (cap. 16) e a aula de Cultura, Inovação e Mudança, qual ação do time de projeto tende a ser mais eficaz para reduzir a resistência?", "expl": "Princípio-chave de Schein: reduzir a ansiedade pela aprendizagem é mais eficaz do que aumentar a ansiedade pela sobrevivência. O estágio é o descongelamento (criar motivação e segurança psicológica). Culpar outro departamento é uma forma de resistência (bode expiatório).", "type": "mc", "options": [["A", "Aumentar a ansiedade pela sobrevivência, alertando que a empresa perderá mercado se o time não aderir imediatamente."], ["B", "Substituir de forma abrupta a previsão manual pelo modelo, para forçar o recongelamento."], ["C", "Entregar o modelo pronto, sem explicar os cálculos, para evitar discussões."], ["D", "Atribuir a resistência a outro departamento, como a TI, e seguir o cronograma."], ["E", "Reduzir a ansiedade pela aprendizagem: envolver o time na construção, oferecer treinamento, tempo, prática e feedback e criar segurança psicológica."]], "answer": "E"}, {"id": "p1q7", "n": 7, "subj": "neg", "tag": "Design organizacional", "pts": 4, "stem": "Uma fintech em crescimento acelerado revê sua estrutura por causa de ruídos de comunicação entre áreas, tarefas sobrepostas e gargalos de decisão. Assinale a alternativa que **NÃO** representa um objetivo de um design organizacional bem estruturado:", "expl": "O design organizacional estrutura funções, responsabilidades e fluxos de trabalho para dar agilidade, clareza e coordenação. Concentrar decisões na cúpula e reduzir autonomia é o oposto disso (o slide desta aula tem só o título; o conteúdo segue o conceito geral).", "type": "mc", "options": [["A", "Definir com clareza papéis e responsabilidades."], ["B", "Melhorar a coordenação e o fluxo de informações entre as áreas."], ["C", "Concentrar todas as decisões na alta gestão, reduzindo a autonomia das equipes."], ["D", "Eliminar redundâncias e conflitos de função entre departamentos."], ["E", "Dar flexibilidade para se adaptar às mudanças do ambiente externo."]], "answer": "C"}, {"id": "p1q8", "n": 8, "subj": "neg", "tag": "Governança (asserção e razão)", "pts": 4, "stem": "Uma startup de análise preditiva já tem tração e clientes recorrentes, mas seus sócios ainda decidem tudo de modo informal. Analise as asserções e a relação proposta entre elas.\n\nI. Uma startup com tração deve manter decisões informais, pois governança é apenas custo e não gera valor.\n\n**PORQUE**\n\nII. A governança demonstra maturidade organizacional e reduz riscos percebidos por investidores, o que pode ampliar a captação de recursos.\n\nAssinale a opção correta:", "expl": "II é verdadeira (governança gera valor: 'maior captação, menor mortalidade'). Justamente por isso I é falsa: na fase de tração o slide recomenda conselho formal, comitês, planejamento e controles internos.", "type": "mc", "options": [["A", "As asserções I e II são verdadeiras, e a II justifica a I."], ["B", "As asserções I e II são verdadeiras, mas a II não justifica a I."], ["C", "A asserção I é verdadeira, e a II é falsa."], ["D", "A asserção I é falsa, e a II é verdadeira."], ["E", "As asserções I e II são falsas."]], "answer": "D"}, {"id": "p1q9", "n": 9, "subj": "mat", "tag": "Binomial", "pts": 4, "stem": "Uma fábrica testa 8 módulos eletrônicos de forma independente. Sabe-se que cada módulo passa no teste com probabilidade de 92%. Qual é a probabilidade de exatamente 7 módulos passarem no teste?", "expl": "P(X=7) = C(8,7)·0,92⁷·0,08¹ = 8·0,5578·0,08 ≈ **0,3570**. (0,5132 é P(X=8); 0,1087 é P(X=6); 0,8702 é P(X≥7)).", "type": "mc", "options": [["A", "0,1087"], ["B", "0,3570"], ["C", "0,5132"], ["D", "0,8702"], ["E", "0,0800"]], "answer": "B"}, {"id": "p1q10", "n": 10, "subj": "mat", "tag": "Distribuição normal", "pts": 4, "stem": "O tempo de resposta de uma API de previsão de demanda segue distribuição normal com média de 120 ms e desvio-padrão de 15 ms. O SLA é violado quando o tempo excede 150 ms. Analise:\n\nI. A probabilidade de violar o SLA equivale a P(Z > 2).\n\nII. Cerca de 2,3% das requisições violam o SLA.\n\nIII. Se a empresa quisesse que apenas 1% das requisições violasse o SLA, o limite de 150 ms deveria diminuir.\n\nEstão corretas apenas:", "expl": "z = (150 − 120)/15 = 2, e P(Z > 2) = 1 − 0,9772 ≈ 0,0228 (I e II verdadeiras). III é falsa: para que menos requisições violem o SLA (1% < 2,3%), o limite precisa **aumentar**.", "type": "mc", "options": [["A", "Apenas I."], ["B", "Apenas II."], ["C", "Apenas I e III."], ["D", "Apenas II e III."], ["E", "Apenas I e II."]], "answer": "E"}, {"id": "p1q11", "n": 11, "subj": "mat", "tag": "IC e teste de hipóteses", "pts": 4, "stem": "O modelo de otimização de um pipeline de IA previu tempo médio de treinamento de 52 minutos. Para testá-lo, a equipe executou 49 treinamentos e obteve média de 55 minutos e desvio-padrão amostral de 14 minutos. Considere população normal e use a aproximação normal (n grande). Valores de z:\n\n| Nível de confiança | Unicaudal | Bicaudal |\n|---|---|---|\n| 90% | 1,28 | 1,645 |\n| 95% | 1,645 | 1,96 |\n| 99% | 2,33 | 2,58 |\n\nAvalie as afirmações:\n\nI. O intervalo de 95% de confiança para o tempo médio de treinamento vai de 51,08 a 58,92 minutos.\n\nII. Como 52 minutos está dentro do IC de 95%, o resultado é consistente com a não rejeição de H₀ no teste bilateral a 5%.\n\nIII. Para verificar se há diferença entre o previsto e o observado, formulam-se H₀: μ = 52 e Hₐ: μ ≠ 52.\n\nIV. No nível de 5% (bilateral), há evidências para rejeitar H₀.\n\nAssinale a alternativa correta:", "expl": "Erro-padrão = 14/√49 = 2. E = 1,96·2 = 3,92 → IC = 55 ± 3,92 = [51,08; 58,92] (I). z = (55 − 52)/2 = 1,5 < 1,96, então **não** se rejeita H₀ (IV é falsa), coerente com o IC conter 52 (II). III é a formulação bilateral correta.", "type": "mc", "options": [["A", "Estão corretas apenas as afirmações I, II e III."], ["B", "Estão corretas apenas as afirmações I e IV."], ["C", "Estão corretas apenas as afirmações II e III."], ["D", "Estão corretas apenas as afirmações I, III e IV."], ["E", "Estão corretas as afirmações I, II, III e IV."]], "answer": "A"}, {"id": "p1q12", "n": 12, "subj": "mat", "tag": "Derivadas parciais", "pts": 4, "stem": "O custo mensal de processamento de um serviço em nuvem é modelado por C(x, y) = 4x² + 3xy + 2y², em que x é a memória alocada (GB) e y é o número de núcleos de CPU (aproximação contínua). Avalie:\n\nI. ∂C/∂x = 8x + 3y.\n\nII. ∂C/∂y = 3x + 4y.\n\nIII. No ponto (x, y) = (2, 3), a CPU (y) exerce maior influência local sobre o custo do que a memória (x).\n\nIV. As derivadas mistas ∂²C/∂x∂y e ∂²C/∂y∂x são iguais a 3, como prevê o Teorema de Clairaut.\n\nEstão corretas:", "expl": "I e II: derivam-se as parcelas tratando a outra variável como constante. III é falsa: em (2, 3), C_x = 16 + 9 = 25 e C_y = 6 + 12 = 18; como |25| > |18|, a **memória** pesa mais localmente. IV é verdadeira: C_xy = C_yx = 3.", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas I e III."], ["C", "Apenas I, II e IV."], ["D", "Apenas II, III e IV."], ["E", "As afirmações I, II, III e IV."]], "answer": "C"}, {"id": "p1q13", "n": 13, "subj": "mat", "tag": "Integral tripla", "pts": 4, "stem": "A carga de processamento de um bloco de dados em forma de paralelepípedo, com x ∈ [0, 2], y ∈ [0, 1] e z ∈ [0, 3], tem densidade ρ(x, y, z) = x + y + z. A carga total é dada por ∭ ρ dz dy dx. Qual é o valor da carga total?", "expl": "Integral em z: ∫₀³ (x + y + z) dz = 3x + 3y + 4,5. Em y: ∫₀¹ (3x + 3y + 4,5) dy = 3x + 1,5 + 4,5 = 3x + 6. Em x: ∫₀² (3x + 6) dx = 6 + 12 = **18**.", "type": "mc", "options": [["A", "9"], ["B", "12"], ["C", "15"], ["D", "18"], ["E", "24"]], "answer": "D"}, {"id": "p1q14", "n": 14, "subj": "mat", "tag": "Transformações lineares", "pts": 4, "stem": "Um pipeline de aumento de dados aplica sobre vetores (x, y) a transformação v′ = A·v, com\n\n```\nA = [ 0  −1 ]\n    [ 1   0 ]\n```\n\nAvalie as afirmações:\n\nI. A transformação é uma rotação de 90° no sentido anti-horário.\n\nII. O determinante de A é 1, portanto a área de figuras no plano é preservada.\n\nIII. O vetor (3, 2) é levado para (2, −3).\n\nIV. A transformação é uma translação, pois altera as duas coordenadas.\n\nEstão corretas:", "expl": "A·(3, 2) = (0·3 − 1·2, 1·3 + 0·2) = (−2, 3), então III é falsa. A é uma rotação de 90° (I) com det = 0·0 − (−1)(1) = 1 (II). Não é translação: A·0 = 0 e toda transformação linear leva a origem na origem.", "type": "mc", "options": [["A", "Apenas I e III."], ["B", "Apenas I e II."], ["C", "Apenas II e IV."], ["D", "Apenas III e IV."], ["E", "Apenas I, II e III."]], "answer": "B"}, {"id": "p1q15", "n": 15, "subj": "prog", "tag": "ETL/ELT e encoding", "pts": 4, "stem": "Uma rede hospitalar integra sistemas legados (estruturados), logs de dispositivos (JSON) e laudos em texto para prever reinternações. Sobre a preparação dos dados, avalie:\n\nI. Para os logs em JSON, a abordagem ELT com Data Lake permite ingestão ágil e flexibilidade; a governança passa a ser aplicada na camada de acesso.\n\nII. A variável tipo_sanguineo, nominal, deve ser tratada com One-Hot Encoding, sem impor ordem entre as categorias.\n\nIII. O LabelEncoder é a opção adequada para transformar as colunas de entrada (X) categóricas.\n\nIV. O escalonador deve ser ajustado (fit) apenas no treino e aplicado (transform) no teste, evitando vazamento de dados.\n\nEstão corretas:", "expl": "III é falsa: o `LabelEncoder` foi projetado para o **alvo y**; em X nominal usa-se One-Hot (ou ordinal, quando há ordem real). As demais são verdadeiras (ELT + Data Lake; One-Hot para nominal; fit no treino e transform no teste).", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas II e III."], ["C", "Apenas III e IV."], ["D", "Apenas I, III e IV."], ["E", "Apenas I, II e IV."]], "answer": "E"}, {"id": "p1q16", "n": 16, "subj": "prog", "tag": "PCA e maldição da dimensionalidade", "pts": 4, "stem": "Uma seguradora aplicou PCA a 5 variáveis padronizadas. A variância explicada por componente foi: CP1 = 55%, CP2 = 25%, CP3 = 10%, CP4 = 6% e CP5 = 4%. Avalie:\n\nI. O PCA é sensível à escala, por isso as variáveis devem ser padronizadas antes.\n\nII. Os dois primeiros componentes explicam 80% da variância.\n\nIII. O PCA é supervisionado: usa a variável-alvo para escolher os componentes.\n\nIV. Bastam 3 componentes para reter ao menos 95% da variância.\n\nEstão corretas:", "expl": "55% + 25% = 80% (II). Acumulado: 55, 80, 90, 96, 100 → precisam de **4** componentes para chegar a 95% (IV falsa). III é falsa: o PCA é **não supervisionado** e cria novas variáveis ordenadas pela variância explicada.", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas I e III."], ["C", "Apenas II e IV."], ["D", "Apenas III e IV."], ["E", "Apenas I, II e IV."]], "answer": "A"}, {"id": "p1q17", "n": 17, "subj": "prog", "tag": "K-means, cotovelo e silhueta", "pts": 4, "stem": "Uma montadora agrupou suas concessionárias com K-means. A inércia para K de 1 a 6 foi: 800, 420, 180, 150, 135 e 128. A silhueta média para K = 3 foi 0,62. Avalie:\n\nI. O gráfico do cotovelo sugere K = 3, pois depois dele o ganho na redução da inércia é pequeno.\n\nII. Escolher K = 6 por ter a menor inércia é o critério mais correto, pois inércia menor sempre indica melhor agrupamento.\n\nIII. Uma silhueta média próxima de 1 indica grupos coesos e bem separados.\n\nIV. O K-means é um algoritmo supervisionado que usa rótulos das concessionárias.\n\nEstão corretas:", "expl": "Quedas: 380, 240, 30, 15, 7 → o cotovelo está em K = 3 (I). A inércia sempre cai com K, e K = n a zeraria, então II é falsa. III é verdadeira. IV é falsa: o K-means é **não supervisionado** (recebe só X).", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas II e IV."], ["C", "Apenas I e III."], ["D", "Apenas III e IV."], ["E", "Apenas I, II e III."]], "answer": "C"}, {"id": "p1q18", "n": 18, "subj": "prog", "tag": "Árvore de decisão", "pts": 4, "stem": "Um time de churn usa árvore de decisão. Dos 12 clientes de treino, 6 cancelaram e 6 não. Ao dividir por plano, o grupo \"Básico\" tem 6 clientes (5 cancelaram e 1 não) e o grupo \"Premium\" tem 6 clientes (1 cancelou e 5 não). Usando entropia com log₂, com H(6, 6) = 1 e H(5/6, 1/6) ≈ 0,650, qual é o ganho de informação de dividir por plano?", "expl": "Ganho = H(S) − Σ (|Sᵥ|/|S|)·H(Sᵥ) = 1 − (0,5·0,650 + 0,5·0,650) = 1 − 0,650 = **0,350**. A árvore escolhe o atributo com maior ganho.", "type": "mc", "options": [["A", "0,650"], ["B", "0,350"], ["C", "1,000"], ["D", "0,175"], ["E", "0,000"]], "answer": "B"}, {"id": "p1q19", "n": 19, "subj": "prog", "tag": "Boxplot e outliers", "pts": 4, "stem": "O boxplot abaixo resume o tempo de resposta (ms) de uma API em produção.\n\n{{box:tempo_resposta (ms)|API,40,60,75,100,130,190}}\n\nAvalie:\n\nI. A mediana é 75 ms e os 50% centrais dos tempos estão entre 60 e 100 ms.\n\nII. O intervalo interquartil (IQR) é de 60 ms.\n\nIII. O valor de 190 ms é um outlier, pois excede Q3 + 1,5·IQR = 160 ms.\n\nAssinale a alternativa correta:", "expl": "Q1 = 60, mediana = 75, Q3 = 100 → IQR = 100 − 60 = **40** (II falsa). Limite superior = 100 + 1,5·40 = 160; 190 > 160, portanto é outlier (III). Um critério sinaliza; o contexto decide o que fazer com o ponto.", "type": "mc", "options": [["A", "Apenas a afirmativa II está correta."], ["B", "Apenas as afirmativas I e II estão corretas."], ["C", "Apenas as afirmativas II e III estão corretas."], ["D", "Apenas as afirmativas I e III estão corretas."], ["E", "Todas as afirmativas estão corretas."]], "answer": "D"}, {"id": "p1q20", "n": 20, "subj": "prog", "tag": "Regressão e avaliação", "pts": 4, "stem": "Uma equipe treinou um modelo de regressão linear para prever as vendas mensais de um segmento de veículos (mil unidades) a partir de indicadores econômicos. Avalie:\n\nI. Usar o mesmo conjunto para treinar e testar é a melhor forma de medir a capacidade de generalização do modelo.\n\nII. O RMSE penaliza erros grandes mais do que o MAE.\n\nIII. Um R² igual a 0 equivale ao desempenho de um modelo que sempre prevê a média.\n\nIV. Um R² próximo de 1 no treino e baixo no teste sugere overfitting.\n\nEstão corretas:", "expl": "I é falsa: o teste precisa ser dado que o modelo não viu. II (erros elevados ao quadrado), III (R² compara com a referência da média) e IV (gap treino × teste) são verdadeiras.", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas I, III e IV."], ["C", "Apenas II e III."], ["D", "Apenas III e IV."], ["E", "Apenas II, III e IV."]], "answer": "E"}, {"id": "p1q21", "n": 21, "subj": "mat", "tag": "Teste t e intervalo de confiança", "pts": 10, "stem": "Um novo pipeline de inferência foi implantado. O modelo antigo tinha tempo médio de 125 ms. Em n = 25 execuções do novo pipeline, obteve-se média de 118 ms e desvio-padrão amostral de 20 ms (σ populacional desconhecido; população aproximadamente normal). Use α = 5% e, quando necessário, os valores críticos de t com 24 graus de liberdade: unicaudal = 1,711 e bicaudal = 2,064.\n\n(a) Formule H₀ e Hₐ para verificar se o novo pipeline é mais rápido e classifique o teste.\n(b) Justifique o uso do teste t e calcule a estatística de teste.\n(c) Decida sobre H₀ e escreva a conclusão de negócio.\n(d) Construa o IC de 95% (bicaudal) para o tempo médio, diga se ele contém 125 ms e comente a coerência com o item (c).\n(e) Se o desvio-padrão amostral fosse 40 ms, com a mesma média e o mesmo n, a conclusão mudaria? Justifique com o cálculo.", "expl": "**(a)** H₀: μ ≥ 125 ms; Hₐ: μ < 125 ms. Teste **unilateral à esquerda** (só interessa saber se reduziu).\n\n**(b)** Usa-se t porque σ é desconhecido e n é pequeno (25 < 30); gl = 24. Erro-padrão = 20/√25 = 4. t = (118 − 125)/4 = **−1,75**.\n\n**(c)** −1,75 < −1,711, logo a estatística cai na região de rejeição: **rejeita-se H₀**. Há evidência, a 5%, de que o novo pipeline é mais rápido; a equipe pode adotá-lo.\n\n**(d)** E = 2,064 · 4 = 8,256 → IC = 118 ± 8,256 = **[109,74; 126,26]**. Ele contém 125 ms. Não há contradição: o IC bilateral de 95% equivale a um teste **bilateral** a 5% (não rejeitaria μ = 125). O teste do item (c) é unilateral (α = 5% concentrado em uma cauda), equivalente a um IC de 90% bilateral. A pergunta feita define qual instrumento usar.\n\n**(e)** Erro-padrão = 40/5 = 8; t = −7/8 = **−0,875**, que não é menor que −1,711: **não se rejeita H₀**. A maior dispersão aumenta o erro-padrão e torna a diferença de 7 ms compatível com a variação natural.", "type": "open"}, {"id": "p1q22", "n": 22, "subj": "prog", "tag": "Métricas, limiar e vazamento", "pts": 10, "stem": "Uma operadora de telecomunicações treinou um classificador para prever churn (positivo = cliente cancela). Avaliado em 300 clientes de teste, o modelo gerou: TP = 45, FP = 15, FN = 30 e TN = 210. A equipe pretende usá-lo para acionar uma campanha de retenção com desconto.\n\n(a) Calcule acurácia, precisão, recall e F1, apresentando as fórmulas.\n(b) Calcule a acurácia de um modelo ingênuo que prevê sempre \"não cancela\" e explique por que a acurácia do modelo real não basta para aprová-lo.\n(c) Perder um cliente custa muito mais do que o desconto da campanha. Qual métrica priorizar e o que acontece com falsos positivos e falsos negativos se a equipe reduzir o limiar de decisão de 0,5 para 0,3?\n(d) A equipe aplicou o oversampling da classe \"cancela\" antes de dividir treino e teste e usou a variável data_cancelamento nas features. Aponte os dois problemas e explique como corrigir.", "expl": "**(a)** Acurácia = (TP+TN)/n = (45+210)/300 = **0,85**. Precisão = TP/(TP+FP) = 45/60 = **0,75**. Recall = TP/(TP+FN) = 45/75 = **0,60**. F1 = 2·P·R/(P+R) = 2·0,75·0,60/1,35 ≈ **0,667**.\n\n**(b)** Negativos reais = 15 + 210 = 225, então o modelo ingênuo acerta 225/300 = **0,75** de acurácia sem encontrar nenhum cliente que cancela. A classe positiva é minoritária (25%): a acurácia esconde que o modelo real só recupera 60% dos cancelamentos. É preciso olhar matriz de confusão, recall e precisão.\n\n**(c)** Priorizar o **recall** (falso negativo = cliente perdido, que custa mais). Reduzir o limiar para 0,3 classifica mais clientes como \"cancela\": os **falsos negativos diminuem** e os **falsos positivos aumentam** (mais descontos dados sem necessidade), ou seja, o recall sobe e a precisão cai (trade-off).\n\n**(d)** (1) Oversampling **antes** do split: cópias do mesmo exemplo caem em treino e teste, e o modelo é avaliado em dados que já viu (vazamento; métrica inflada). Corrigir: separar treino e teste primeiro e rebalancear **só o treino**. (2) `data_cancelamento` só existe **depois** do cancelamento: é *data leakage* (a variável entrega o alvo). Deve sair de X; a pergunta-chave é \"eu teria este dado no momento da decisão?\".", "type": "open"}]}, {"id": "p2", "name": "Prova 2", "q": [{"id": "p2q1", "n": 1, "subj": "lid", "tag": "Viés de interação", "pts": 4, "stem": "Um banco lançou um assistente virtual que aprende continuamente com as conversas dos clientes. Semanas depois, a equipe percebeu que o assistente passou a reproduzir expressões ofensivas e a priorizar as respostas dos usuários que mais interagem, ampliando os padrões desse grupo. Com base em Ferrara (2024) e na aula de Viés e IA, esse é um exemplo de qual fonte de viés?", "expl": "Os três caminhos de entrada do viés em IA são: **dados** (amostragem, rótulos, proxies), **algoritmo** (função objetivo, variáveis, limiares) e **interação** (o sistema aprende com o uso e amplifica padrões). O caso descreve o terceiro.", "type": "mc", "options": [["A", "Viés de dados por amostragem: a base de treino inicial era pequena."], ["B", "Viés algorítmico: a função objetivo escolhida é sempre injusta."], ["C", "Viés de interação: o sistema aprende com o uso (cliques, feedback, câmaras de eco), que realimenta e amplifica padrões."], ["D", "Viés de confirmação do desenvolvedor: a equipe só procurou evidências favoráveis."], ["E", "Cegueira por desatenção: o time não percebeu o inesperado durante a contagem de acertos."]], "answer": "C"}, {"id": "p2q2", "n": 2, "subj": "des", "tag": "Stakeholders e personas", "pts": 4, "stem": "No projeto MAHLE, a equipe mapeou quem lida com a previsão de vendas: o planejador de demanda (usa a previsão para decidir quanto produzir), o diretor de operações (decide a capacidade da fábrica com base nela), e o comprador de supply chain e o planejador de produção (recebem os volumes e precisam programar compras e linha, sem decidir a previsão). Avalie, segundo a aula de UX para modelos preditivos:\n\nI. O planejador de demanda é usuário primário; o diretor de operações é usuário secundário.\n\nII. O comprador e o planejador de produção são usuários afetados: vivem as consequências de um erro de previsão (excesso ou falta de componentes, replanejamento).\n\nIII. Priorizar o planejador ou o diretor muda o que o modelo precisa entregar (previsão com margem de erro explícita versus cenários e explicação).\n\nIV. Os dados históricos de emplacamento já representam o fator humano de quem decide, dispensando a análise de stakeholders.\n\nEstão corretas:", "expl": "IV é falsa: os dados mostram métricas e histórico (o volume), e **não** mostram quem decide e quem sofre o impacto. Stakeholder é 'qualquer grupo que afete ou seja afetado' (Freeman).", "type": "mc", "options": [["A", "Apenas I e IV."], ["B", "Apenas II e IV."], ["C", "Apenas III e IV."], ["D", "Apenas I, II e IV."], ["E", "Apenas I, II e III."]], "answer": "E"}, {"id": "p2q3", "n": 3, "subj": "des", "tag": "Storytelling com dados", "pts": 4, "stem": "Na apresentação final, o grupo mostra um slide com \"Acurácia geral: 82%; no segmento crítico: 61%\". O professor pede que o slide comunique uma mensagem, e não apenas o dado, e conduza a atenção do público. Segundo a aula de Storytelling com Dados, qual proposta é mais adequada?", "expl": "'Dado não é mensagem.' O título comunica a mensagem (não descreve o eixo), a cor aponta, o texto explica e a conclusão fica escrita. Selecionar vem antes de mostrar, e a ordem da história não é a ordem do projeto.", "type": "mc", "options": [["A", "Título \"Acurácia por segmento\", com todos os indicadores na mesma cor para não influenciar a leitura."], ["B", "Título \"O modelo acerta no geral, mas falha no segmento mais crítico\", com o dado do segmento crítico destacado por cor e a conclusão escrita no slide."], ["C", "Manter o gráfico completo e deixar que cada pessoa tire a própria conclusão."], ["D", "Substituir o gráfico por um parágrafo com todos os resultados do projeto na ordem em que foram obtidos."], ["E", "Mostrar os 70 indicadores em uma só página para demonstrar completude."]], "answer": "B"}, {"id": "p2q4", "n": 4, "subj": "neg", "tag": "SWOT da MAHLE", "pts": 4, "stem": "Na SWOT do projeto de previsão de vendas da MAHLE, o grupo classifica itens usando a pergunta \"a MAHLE controla isso?\". Avalie as classificações:\n\nI. \"Câmbio volátil, que encarece componentes importados\" é uma ameaça.\n\nII. \"Décadas de dados públicos de produção e vendas da América Latina, acompanhados pela parceira\" é uma força.\n\nIII. \"Baixa adesão da equipe comercial às recomendações do modelo\" é uma oportunidade externa.\n\nIV. \"Avanço da eletrificação (HEV/EV), que altera o mix de motorização\" é um fator externo, e não uma força interna.\n\nEstão corretas:", "expl": "Se a MAHLE controla, é força/fraqueza; se não controla, é oportunidade/ameaça. III é falsa: a baixa adesão da equipe comercial é interna (fraqueza) ou risco do projeto, não uma oportunidade externa.", "type": "mc", "options": [["A", "Apenas I, II e IV."], ["B", "Apenas I e III."], ["C", "Apenas II e III."], ["D", "Apenas III e IV."], ["E", "As afirmações I, II, III e IV."]], "answer": "A"}, {"id": "p2q5", "n": 5, "subj": "neg", "tag": "Princípios da LGPD", "pts": 4, "stem": "No projeto MAHLE, a política de dados aplica os princípios da LGPD. Associe cada princípio (coluna 1) à sua aplicação no projeto (coluna 2).\n\n**Coluna 1**\n1. Finalidade\n2. Necessidade\n3. Segurança\n4. Transparência\n5. Responsabilização\n\n**Coluna 2**\n( ) Demonstrar, com registros, que o grupo seguiu as regras.\n( ) Usar a base somente para treinar e avaliar o modelo de previsão de vendas.\n( ) Manter repositório privado e ambiente de execução controlado.\n( ) Manter na base apenas as colunas que o modelo usa.\n( ) Permitir que o parceiro saiba o que é feito com o dado cedido.", "expl": "Responsabilização (5) → demonstrar; Finalidade (1) → uso só para o objetivo; Segurança (3) → repositório privado; Necessidade (2) → só colunas do modelo; Transparência (4) → parceiro sabe o que se faz.", "type": "mc", "options": [["A", "1 – 2 – 3 – 4 – 5"], ["B", "5 – 2 – 3 – 1 – 4"], ["C", "4 – 1 – 3 – 2 – 5"], ["D", "5 – 1 – 3 – 2 – 4"], ["E", "5 – 1 – 2 – 3 – 4"]], "answer": "D"}, {"id": "p2q6", "n": 6, "subj": "neg", "tag": "Cultura (Schein cap. 1)", "pts": 4, "stem": "Numa startup de IA, o time técnico adotou métodos ágeis e ferramentas modernas, mas as decisões continuam dependendo da opinião do fundador e ninguém discorda dele em reunião. Com base em Schein (cap. 1), qual leitura da cultura é a mais adequada?", "expl": "Artefatos: visíveis, difíceis de interpretar sozinhos. Premissas básicas: o DNA cultural, estáveis, inconscientes e difíceis de mudar. Uma hipótese de premissa precisa ser testada antes de conduzir a mudança.", "type": "mc", "options": [["A", "Como os rituais ágeis existem, a cultura de experimentação já está consolidada."], ["B", "Cultura é apenas a lista de valores expostos no site da empresa."], ["C", "Os artefatos observáveis (rituais ágeis, ferramentas) coexistem com premissas básicas, mais profundas e inconscientes, que só se revelam ao investigar o que o grupo assume como certo sobre decidir e discordar."], ["D", "A cultura muda facilmente, bastando substituir o fundador."], ["E", "Premissas básicas são visíveis e fáceis de mudar, enquanto artefatos são inconscientes."]], "answer": "C"}, {"id": "p2q7", "n": 7, "subj": "neg", "tag": "Design organizacional", "pts": 4, "stem": "Uma empresa de software cresce e discute como organizar suas equipes: por especialidade (funcional), por produto (divisional) ou em matriz. Sobre design organizacional, avalie:\n\nI. A estrutura funcional agrupa pessoas por especialidade e favorece a eficiência técnica, mas pode gerar silos e lentidão na integração entre áreas.\n\nII. A estrutura matricial combina critérios (por exemplo, função e projeto) e melhora a coordenação, mas a dupla subordinação pode gerar conflitos.\n\nIII. Reduzir camadas hierárquicas (estrutura mais achatada) tende a aumentar o número de níveis de aprovação.\n\nIV. Definir claramente papéis e responsabilidades diminui a sobreposição de tarefas e os gargalos decisórios.\n\nEstão corretas:", "expl": "III é falsa: estruturas mais achatadas têm **menos** camadas e aproximam a decisão de quem executa. (O slide da aula só tem o título; a questão segue os conceitos gerais de design organizacional.)", "type": "mc", "options": [["A", "Apenas I e III."], ["B", "Apenas I, II e IV."], ["C", "Apenas II e III."], ["D", "Apenas III e IV."], ["E", "As afirmações I, II, III e IV."]], "answer": "B"}, {"id": "p2q8", "n": 8, "subj": "neg", "tag": "Governança (asserção e razão)", "pts": 4, "stem": "Uma startup de dados prepara sua governança para receber investimento. Analise as asserções e a relação proposta entre elas.\n\nI. Um comitê de auditoria contribui para a prestação de contas (accountability) da empresa.\n\n**PORQUE**\n\nII. O comitê de auditoria fiscaliza práticas contábeis e controles internos e reporta aos administradores e acionistas.\n\nAssinale a opção correta:", "expl": "Prestação de contas é um dos 4 princípios (transparência, equidade, prestação de contas, responsabilidade corporativa). Fiscalizar contabilidade e controles é justamente o mecanismo pelo qual o comitê de auditoria realiza isso.", "type": "mc", "options": [["A", "As asserções I e II são verdadeiras, e a II justifica a I."], ["B", "As asserções I e II são verdadeiras, mas a II não justifica a I."], ["C", "A asserção I é verdadeira, e a II é falsa."], ["D", "A asserção I é falsa, e a II é verdadeira."], ["E", "As asserções I e II são falsas."]], "answer": "A"}, {"id": "p2q9", "n": 9, "subj": "mat", "tag": "Binomial", "pts": 4, "stem": "Uma equipe de SRE mantém 6 servidores independentes. Cada servidor permanece disponível durante o mês com probabilidade de 0,7. Qual é a probabilidade de pelo menos 5 servidores permanecerem disponíveis?", "expl": "P(X ≥ 5) = P(5) + P(6) = 6·0,7⁵·0,3 + 0,7⁶ = 0,3025 + 0,1176 = **0,4202**. (0,3025 é só P(5); 0,1176 é só P(6); 0,5798 é P(X ≤ 4)).", "type": "mc", "options": [["A", "0,3025"], ["B", "0,1176"], ["C", "0,5798"], ["D", "0,7000"], ["E", "0,4202"]], "answer": "E"}, {"id": "p2q10", "n": 10, "subj": "mat", "tag": "Distribuição normal", "pts": 4, "stem": "O tempo de treinamento de um modelo segue distribuição normal com média de 200 min e desvio-padrão de 30 min. Use P(Z < 1) = 0,8413 e, para os 5% superiores, z = 1,645. Avalie:\n\nI. P(X < 230) ≈ 84,13%.\n\nII. Os 5% dos treinamentos mais lentos ultrapassam cerca de 249,35 min.\n\nIII. Cerca de 68% dos treinamentos duram entre 170 e 230 min.\n\nIV. P(X > 260) ≈ 6,7%.\n\nEstão corretas:", "expl": "I: z = 1 → 0,8413. II: 200 + 1,645·30 = 249,35. III: μ ± 1σ ≈ 68%. IV é falsa: z = (260 − 200)/30 = 2 → P(Z > 2) ≈ 2,3%, não 6,7%.", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas II e IV."], ["C", "Apenas III e IV."], ["D", "Apenas I, II e III."], ["E", "As afirmações I, II, III e IV."]], "answer": "D"}, {"id": "p2q11", "n": 11, "subj": "mat", "tag": "Teste z bilateral", "pts": 4, "stem": "A meta de tempo de resposta de um serviço é 100 ms, com desvio-padrão populacional σ = 12 ms (conhecido). Uma amostra de 36 requisições teve média de 96 ms. Considere teste bilateral. Valores críticos: ±1,96 para α = 5% e ±2,58 para α = 1%. Avalie:\n\nI. O erro-padrão da média é 2 ms.\n\nII. A estatística de teste é z = −2,0.\n\nIII. O p-valor bilateral é aproximadamente 4,55%.\n\nIV. Com α = 1% também se rejeita H₀.\n\nEstão corretas:", "expl": "EP = 12/√36 = 2; z = (96 − 100)/2 = −2; p = 2·P(Z < −2) = 2·0,0228 ≈ 0,0455 < 0,05 (rejeita a 5%). Com α = 1%, |−2| < 2,58: **não** rejeita (IV falsa).", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas II e IV."], ["C", "Apenas I, II e III."], ["D", "Apenas III e IV."], ["E", "As afirmações I, II, III e IV."]], "answer": "C"}, {"id": "p2q12", "n": 12, "subj": "mat", "tag": "Regra da cadeia", "pts": 4, "stem": "O throughput de um serviço é P(x, y) = x²y, em que x é o tráfego (mil requisições/s) e y é o número de instâncias em operação. Ao longo do dia, x(t) = 3t e y(t) = t² + 2, com t em horas. Pela regra da cadeia, dP/dt em t = 2 h vale:", "expl": "Em t = 2: x = 6, y = 6. P_x = 2xy = 72; dx/dt = 3; P_y = x² = 36; dy/dt = 2t = 4. dP/dt = 72·3 + 36·4 = 216 + 144 = **360**. Conferindo: P(t) = 9t²(t² + 2) = 9t⁴ + 18t²; P′ = 36t³ + 36t → 288 + 72 = 360.", "type": "mc", "options": [["A", "360"], ["B", "216"], ["C", "288"], ["D", "432"], ["E", "144"]], "answer": "A"}, {"id": "p2q13", "n": 13, "subj": "mat", "tag": "Integral dupla em região triangular", "pts": 4, "stem": "A densidade de requisições de um cluster é f(x, y) = 3y sobre a região triangular D limitada por x = 0, y = 2 e y = x (vértices (0, 0), (0, 2) e (2, 2)). Calcule ∬_D f dA.", "expl": "Descrição tipo II: 0 ≤ y ≤ 2 e 0 ≤ x ≤ y. ∫₀² ∫₀ʸ 3y dx dy = ∫₀² 3y² dy = **8**. (Conferindo na ordem dy dx: ∫₀² ∫ₓ² 3y dy dx = ∫₀² (6 − 3x²/2) dx = 12 − 4 = 8.)", "type": "mc", "options": [["A", "4"], ["B", "8"], ["C", "6"], ["D", "12"], ["E", "16"]], "answer": "B"}, {"id": "p2q14", "n": 14, "subj": "mat", "tag": "Autovalores e diagonalização", "pts": 4, "stem": "Um pipeline aplica sobre dois atributos a transformação de matriz A = [[4, 2], [1, 3]] (primeira linha 4 e 2; segunda linha 1 e 3). Avalie:\n\nI. Os autovalores de A são 2 e 5.\n\nII. O vetor v = (2, 1) é autovetor associado ao autovalor 5.\n\nIII. A é diagonalizável: A = PDP⁻¹, com P formada pelos autovetores e D com os autovalores na mesma ordem.\n\nIV. O determinante de A é 12.\n\nEstão corretas:", "expl": "tr = 7 e det = 12 − 2 = **10** (IV falsa) → λ² − 7λ + 10 = 0 → λ = 2 e 5. A·(2, 1) = (10, 5) = 5·(2, 1). Como há 2 autovetores independentes, A é diagonalizável.", "type": "mc", "options": [["A", "Apenas I e IV."], ["B", "Apenas II e IV."], ["C", "Apenas III e IV."], ["D", "Apenas I, II e III."], ["E", "As afirmações I, II, III e IV."]], "answer": "D"}, {"id": "p2q15", "n": 15, "subj": "prog", "tag": "Pré-processamento e outliers", "pts": 4, "stem": "Uma varejista prepara uma base para prever demanda. Avalie:\n\nI. A regra do IQR (1,5 × IQR) sinaliza possíveis outliers, mas a decisão de removê-los depende do contexto (erro de digitação, evento raro ou informação valiosa).\n\nII. Preencher valores ausentes com a média é sempre mais robusto do que preencher com a mediana.\n\nIII. Calcular a média para imputação com todo o conjunto (treino e teste) antes da divisão é uma boa prática.\n\nIV. Remover duplicatas é uma decisão que depende da regra de negócio e da chave de identidade.\n\nEstão corretas:", "expl": "II é falsa: a mediana é mais **robusta** a extremos. III é falsa: usar o teste para calcular a média é *data leakage*; o imputer é ajustado (fit) no treino e aplicado (transform) no teste.", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas II e III."], ["C", "Apenas III e IV."], ["D", "Apenas I, II e IV."], ["E", "Apenas I e IV."]], "answer": "E"}, {"id": "p2q16", "n": 16, "subj": "prog", "tag": "Desbalanceamento e ROC", "pts": 4, "stem": "Um modelo de detecção de fraude foi treinado em uma base em que apenas 1% das transações são fraudes. Avalie:\n\nI. Prever sempre \"não fraude\" já produz 99% de acurácia sem detectar nenhuma fraude.\n\nII. Oversampling e undersampling devem ser aplicados apenas ao conjunto de treino, após a divisão treino/teste.\n\nIII. Uma AUC de 0,5 indica separação perfeita entre as classes.\n\nIV. A precisão é calculada por TP/(TP + FN).\n\nEstão corretas:", "expl": "III é falsa: AUC = 0,5 equivale a um classificador aleatório (1,0 é a separação perfeita). IV é falsa: TP/(TP+FN) é o **recall**; a precisão é TP/(TP+FP).", "type": "mc", "options": [["A", "Apenas I e III."], ["B", "Apenas I e II."], ["C", "Apenas II e IV."], ["D", "Apenas III e IV."], ["E", "Apenas I, II e III."]], "answer": "B"}, {"id": "p2q17", "n": 17, "subj": "prog", "tag": "Recomendação: similaridade do cosseno", "pts": 4, "stem": "Uma plataforma de e-commerce compara dois usuários pelo padrão de avaliações de quatro produtos (0 = não avaliou): Usuário 1 = [4, 0, 5, 3] e Usuário 2 = [5, 0, 4, 0]. Qual é a similaridade do cosseno entre eles?", "expl": "cos = (u₁·u₂)/(‖u₁‖·‖u₂‖) = (4·5 + 0 + 5·4 + 0)/(√50 · √41) = 40/45,28 ≈ **0,883**. O cosseno mede o ângulo entre os vetores de avaliações, não o tamanho.", "type": "mc", "options": [["A", "0,883"], ["B", "0,500"], ["C", "0,640"], ["D", "0,995"], ["E", "1,000"]], "answer": "A"}, {"id": "p2q18", "n": 18, "subj": "prog", "tag": "Métricas de classificação", "pts": 4, "stem": "Um modelo de churn foi avaliado em 1.000 clientes e gerou: TP = 80, FP = 20, FN = 40 e TN = 860. Qual é o F1-score do modelo?", "expl": "Precisão = 80/100 = 0,80; recall = 80/120 = 0,667; F1 = 2·0,80·0,667/(0,80 + 0,667) ≈ **0,727**. (0,940 é a acurácia; 0,800 é a precisão; 0,667 é o recall.) A acurácia de 94% esconde o recall de 67% em uma classe rara.", "type": "mc", "options": [["A", "0,940"], ["B", "0,800"], ["C", "0,727"], ["D", "0,667"], ["E", "0,500"]], "answer": "C"}, {"id": "p2q19", "n": 19, "subj": "prog", "tag": "Boxplot e outliers", "pts": 4, "stem": "O boxplot abaixo mostra o consumo de energia (kWh) de um data center.\n\n{{box:consumo (kWh)|Data center,20,35,50,70,100,150}}\n\nAvalie:\n\nI. A mediana do consumo é 70 kWh.\n\nII. O intervalo interquartil (IQR) é de 35 kWh.\n\nIII. O valor de 150 kWh é um outlier, pois excede Q3 + 1,5·IQR = 122,5 kWh.\n\nAssinale a alternativa correta:", "expl": "A mediana (linha dentro da caixa) é 50; 70 é o Q3 (I falsa). IQR = 70 − 35 = 35 (II). Limite superior = 70 + 1,5·35 = 122,5; 150 > 122,5 (III).", "type": "mc", "options": [["A", "Apenas a afirmativa I está correta."], ["B", "Apenas as afirmativas I e II estão corretas."], ["C", "Apenas as afirmativas I e III estão corretas."], ["D", "Apenas as afirmativas II e III estão corretas."], ["E", "Todas as afirmativas estão corretas."]], "answer": "D"}, {"id": "p2q20", "n": 20, "subj": "prog", "tag": "Validação cruzada e hiperparâmetros", "pts": 4, "stem": "Uma equipe usa GridSearchCV com cv = 5 e a grade: n_estimators ∈ {50, 100, 200}, max_depth ∈ {3, 5, 7} e criterion ∈ {\"gini\", \"entropy\"}. Quantos treinamentos a busca realiza na validação cruzada (sem contar o reajuste final)?", "expl": "Combinações = 3 × 3 × 2 = 18; cada uma é treinada em 5 folds: 18 × 5 = **90**. O Random Search com `n_iter` sorteia só parte da grade e costuma achar solução quase tão boa com menos tentativas.", "type": "mc", "options": [["A", "18"], ["B", "30"], ["C", "45"], ["D", "180"], ["E", "90"]], "answer": "E"}, {"id": "p2q21", "n": 21, "subj": "mat", "tag": "Integral dupla e inversão de ordem", "pts": 10, "stem": "A densidade de carga de um cluster de servidores em uma fronteira triangular D, delimitada por y = 0, x = 4 e y = x/2 (vértices (0, 0), (4, 0) e (4, 2)), é f(x, y) = 6x.\n\n(a) Esboce D e descreva-a como região do tipo I e do tipo II.\n(b) Calcule ∬_D f dA na ordem dy dx.\n(c) Refaça o cálculo na ordem dx dy e verifique se o Teorema de Fubini se confirma.\n(d) Explique por que, ao inverter a ordem, o limite inferior de x é 2y e não 0.\n(e) Interprete o valor obtido no contexto da carga do cluster.", "expl": "**(a)** Tipo I (fatias verticais): 0 ≤ x ≤ 4 e 0 ≤ y ≤ x/2. Tipo II (fatias horizontais): 0 ≤ y ≤ 2 e 2y ≤ x ≤ 4 (de y = x/2 isolamos x = 2y).\n\n**(b)** ∫₀⁴ ∫₀^(x/2) 6x dy dx = ∫₀⁴ 6x·(x/2) dx = ∫₀⁴ 3x² dx = [x³]₀⁴ = **64**.\n\n**(c)** ∫₀² ∫_{2y}⁴ 6x dx dy = ∫₀² [3x²]_{2y}⁴ dy = ∫₀² (48 − 12y²) dy = 96 − 32 = **64**. As expressões intermediárias diferem, mas o resultado final é o mesmo (Fubini).\n\n**(d)** Inverter a ordem não é trocar as letras: para um y fixo, a \"seta\" horizontal entra na região sobre a reta y = x/2 (ou seja, x = 2y) e sai em x = 4. Só o desenho e a seta entra/sai mostram isso.\n\n**(e)** O resultado 64 é a carga total acumulada sobre toda a região triangular (a densidade integrada vira um único número, útil para planejamento de capacidade).", "type": "open"}, {"id": "p2q22", "n": 22, "subj": "prog", "tag": "Deploy, pipeline e explicabilidade", "pts": 10, "stem": "Uma consultoria treinou um modelo de previsão de demanda que teve 92% de acurácia no notebook. Ao ser colocado em produção pela equipe de vendas, a acurácia caiu para 61%. O código de produção aplica `scaler.fit_transform` em cada nova requisição e o arquivo salvo contém apenas o modelo. O cliente também pediu que cada previsão venha com os fatores que mais pesaram.\n\n(a) Explique por que o desempenho caiu, citando dois erros do processo de produção.\n(b) Descreva como corrigir com `ColumnTransformer` e `Pipeline`, e como exportar (pickle ou joblib). Por que joblib é o recomendado?\n(c) Explique o que o MLflow registra e por que isso ajuda quando há várias versões do modelo.\n(d) Explique como o SHAP atende ao pedido do cliente e por que isso difere da importância global das variáveis.", "expl": "**(a)** (1) O pré-processamento **não foi exportado junto** com o modelo: em produção os dados chegam brutos e não passam pelas mesmas transformações do treino. (2) `fit_transform` em produção reaprende média e desvio a cada requisição (deveria ser apenas `transform` com parâmetros aprendidos no treino), o que gera divergência entre treino e produção. Ambiente controlado e limpo do notebook ≠ dados novos, chegando um a um, nem sempre limpos.\n\n**(b)** `ColumnTransformer` aplica a transformação certa por tipo de coluna (numéricas: imputer + StandardScaler; categóricas: imputer + OneHotEncoder) e é o passo de pré-processamento de um `Pipeline([('prep', ct), ('modelo', RandomForest...)])`. `pipeline.fit(X_train, y_train)` roda tudo na ordem certa; `joblib.dump(pipeline, 'pipeline.joblib')` salva o objeto completo; em produção, `joblib.load(...).predict(dados_brutos)`. O joblib é otimizado para objetos com muitos arrays NumPy (modelos) e é a opção recomendada pelo scikit-learn; ambos podem não abrir em outra versão de Python/biblioteca, então versionar o ambiente.\n\n**(c)** O MLflow (tracking) registra, por *run*, os **parâmetros** (max_depth, n_estimators), as **métricas** (acurácia, F1) e os **artefatos** (modelo, gráficos), agrupados em experimentos. Assim se compara e reproduz qual configuração gerou qual resultado, sem arquivos como `modelo_final_v2_AGORA_VAI.pkl`.\n\n**(d)** O SHAP explica **cada previsão individual**: valor base (previsão média) + contribuição de cada variável (que empurra para cima ou para baixo) = previsão do modelo. Isso responde \"por que este cliente foi sinalizado\". A importância global só diz o peso médio das variáveis no modelo inteiro, sem explicar um caso específico.", "type": "open"}]}, {"id": "p3", "name": "Prova 3", "q": [{"id": "p3q1", "n": 1, "subj": "lid", "tag": "Ética e viés em IA", "pts": 4, "stem": "Em 2016, o concurso Beauty.AI prometeu um júri de robôs \"sem preconceitos\", mas o algoritmo perpetuou vieses. Em 2018, o estudo *Gender Shades* mostrou erro de até 34,7% na classificação de gênero para mulheres de pele escura, contra 0,8% para homens de pele clara, em sistemas comerciais. Com base na aula de Viés e IA, avalie:\n\nI. Um viés é um desvio sistemático de julgamento, e não um erro aleatório.\n\nII. A causa central do resultado de *Gender Shades* foi a base de treino dominada por rostos claros e masculinos.\n\nIII. Viés e injustiça (*bias* e *fairness*) são conceitos sinônimos.\n\nIV. Para mitigar, é adequado auditar a representatividade dos dados, procurar proxies e formular hipóteses testáveis.\n\nEstão corretas:", "expl": "III é falsa: viés (desvio) e justiça (*fairness*) são conceitos distintos. A auditoria de vieses da aula olha representação, origem, proxies e experimentos que confirmem ou refutem a hipótese.", "type": "mc", "options": [["A", "Apenas I e III."], ["B", "Apenas II e III."], ["C", "Apenas III e IV."], ["D", "Apenas I, II e IV."], ["E", "As afirmações I, II, III e IV."]], "answer": "D"}, {"id": "p3q2", "n": 2, "subj": "des", "tag": "UX e modelos preditivos", "pts": 4, "stem": "Um squad de produto discute usar IA em uma nova funcionalidade de previsão. Com base na aula de UX para modelos preditivos e no autoestudo do Google PAIR, avalie:\n\nI. No CRISP-DM, é na implantação que as pessoas encontram o modelo; sem alguém para usar a previsão, o ciclo recomeça.\n\nII. A IA é sempre a melhor escolha, inclusive quando há erros críticos com alto custo e exigência de transparência total.\n\nIII. É importante avaliar se a IA deve automatizar uma tarefa ou aumentar a capacidade da pessoa de realizá-la.\n\nIV. Sem confiança do usuário não há adoção, então construir confiança é um desafio de design.\n\nEstão corretas:", "expl": "II é falsa: erros críticos e necessidade de transparência total estão entre os casos em que a IA **não** é a melhor solução (ao lado de previsibilidade, dados estáticos e rapidez/custo).", "type": "mc", "options": [["A", "Apenas I, III e IV."], ["B", "Apenas I e II."], ["C", "Apenas II e III."], ["D", "Apenas II e IV."], ["E", "As afirmações I, II, III e IV."]], "answer": "A"}, {"id": "p3q3", "n": 3, "subj": "des", "tag": "Escolha do gráfico", "pts": 4, "stem": "A diretoria da MAHLE quer ver, mês a mês ao longo de 3 anos, como as vendas totais de veículos se compõem entre motorizações (ICE, HEV e EV) e como cada parte evolui no tempo. O designer avalia alternativas. Qual escolha é a mais adequada, segundo a aula de Design e Visualização de Dados?", "expl": "Composição (partes de um total) → barras empilhadas; com poucas partes a leitura é boa. Muitas pizzas exigem comparar ângulos (difícil); histograma mostra distribuição, não evolução; dispersão é para relação entre duas quantitativas, e a versão sem tempo perde a pergunta.", "type": "mc", "options": [["A", "Uma pizza por mês, com fatias por motorização, pois a pizza compara ângulos com precisão."], ["B", "Histograma das vendas mensais, pois mostra a evolução no tempo."], ["C", "Barras empilhadas por mês, uma cor por motorização, pois mostram como as partes compõem o total ao longo do tempo."], ["D", "Gráfico de dispersão entre mês e motorização, ligando os pontos."], ["E", "Barras simples com o total dos 3 anos por motorização, ocultando o tempo."]], "answer": "C"}, {"id": "p3q4", "n": 4, "subj": "neg", "tag": "LGPD e política de dados", "pts": 4, "stem": "O grupo do projeto MAHLE recebeu uma base que combina dados públicos de mercado (ANFAVEA, Banco Central) com o critério de seleção e os pesos das variáveis definidos pela parceira, que os classificou como confidenciais. Os dados serão tratados no Colab e o código será publicado no GitHub. Qual conduta é a adequada?", "expl": "Regras do módulo: nada de base bruta no GitHub público; nada de base em IA generativa (é compartilhar dado do parceiro com terceiro); execução no ambiente combinado; quem classifica o que é confidencial é o parceiro; em dúvida, perguntar antes.", "type": "mc", "options": [["A", "Subir a base bruta ao GitHub público, pois os dados de mercado são públicos."], ["B", "Colar uma amostra da base em um chat de IA generativa para acelerar a análise."], ["C", "Manter cópias da base em drives pessoais de cada integrante."], ["D", "Decidir por conta própria quais variáveis são confidenciais, sem consultar a MAHLE."], ["E", "Publicar apenas código, resultados agregados e documentação; a base bruta e o conteúdo marcado como restrito não sobem ao repositório público, e a base não é colada em ferramentas de IA generativa."]], "answer": "E"}, {"id": "p3q5", "n": 5, "subj": "neg", "tag": "Paradoxos de Pisano", "pts": 4, "stem": "Em Pisano (HBR, 2019), características \"fáceis de gostar\" da cultura inovadora precisam ser contrabalançadas por comportamentos mais difíceis. Associe cada característica (coluna 1) ao seu contrapeso (coluna 2).\n\n**Coluna 1**\n1. Tolerância à falha\n2. Experimentação\n3. Segurança psicológica\n4. Colaboração\n5. Não-hierarquia\n\n**Coluna 2**\n( ) Candura brutal\n( ) Liderança forte\n( ) Intolerância à incompetência\n( ) Responsabilidade individual\n( ) Disciplina rigorosa", "expl": "Segurança psicológica × candura; não-hierarquia × liderança forte; tolerância à falha × intolerância à incompetência; colaboração × responsabilidade individual; experimentação × disciplina.", "type": "mc", "options": [["A", "1 – 2 – 3 – 4 – 5"], ["B", "3 – 5 – 1 – 4 – 2"], ["C", "3 – 1 – 5 – 4 – 2"], ["D", "5 – 3 – 1 – 4 – 2"], ["E", "3 – 5 – 4 – 1 – 2"]], "answer": "B"}, {"id": "p3q6", "n": 6, "subj": "neg", "tag": "Cultura (Schein cap. 1)", "pts": 4, "stem": "Na MAHLE, um observador do projeto nota o jargão das planilhas, a forma de comunicar o forecast nas reuniões mensais e o hábito de decidir \"pela experiência\". Segundo Schein (cap. 1), o que melhor descreve a relação entre esses elementos e a cultura da empresa?", "expl": "Cultura é aprendizagem acumulada e compartilhada; no topo, artefatos; na base, premissas básicas. 'Ter uma hipótese de premissa não é o mesmo que confirmá-la.'", "type": "mc", "options": [["A", "São a própria cultura; não há nada além do que se observa."], ["B", "São premissas básicas e, por isso, são fáceis de mudar."], ["C", "São valores expostos, que sempre coincidem com o comportamento real."], ["D", "São artefatos observáveis, fáceis de ver e difíceis de interpretar sozinhos; a premissa básica (por exemplo, \"quem tem experiência decide\") é mais profunda, estável e inconsciente, e precisa ser testada como hipótese."], ["E", "Não dizem nada sobre cultura, pois cultura é só o clima do ambiente físico."]], "answer": "D"}, {"id": "p3q7", "n": 7, "subj": "neg", "tag": "Design organizacional", "pts": 4, "stem": "Uma healthtech com áreas que se sobrepõem revê sua estrutura. Assinale a alternativa que **NÃO** é resultado esperado de um design organizacional bem estruturado:", "expl": "Design organizacional busca clareza de papéis, coordenação e agilidade. Mais camadas de aprovação geram gargalos decisórios, o oposto do objetivo.", "type": "mc", "options": [["A", "Papéis e responsabilidades mais claros."], ["B", "Fluxo de informação mais eficiente entre equipes."], ["C", "Menos sobreposição de tarefas entre departamentos."], ["D", "Maior agilidade e foco no cliente."], ["E", "Aumentar o número de camadas de aprovação para que toda decisão passe pela diretoria."]], "answer": "E"}, {"id": "p3q8", "n": 8, "subj": "neg", "tag": "Governança (asserção e razão)", "pts": 4, "stem": "Uma startup de dados cresce e planeja vender parte do negócio no futuro. Analise as asserções e a relação proposta entre elas.\n\nI. Na fase de escala, a startup deve buscar conselho de administração independente, auditoria externa e compliance completo.\n\n**PORQUE**\n\nII. Investidores e eventuais saídas (IPO ou M&A) exigem governança em nível corporativo.\n\nAssinale a opção correta:", "expl": "Fase 4 (Escala): governança em nível corporativo, conselho independente, comitês especializados, auditoria externa e preparação para saída. Desafio: manter a cultura empreendedora em estrutura formal.", "type": "mc", "options": [["A", "As asserções I e II são verdadeiras, e a II justifica a I."], ["B", "As asserções I e II são verdadeiras, mas a II não justifica a I."], ["C", "A asserção I é verdadeira, e a II é falsa."], ["D", "A asserção I é falsa, e a II é verdadeira."], ["E", "As asserções I e II são falsas."]], "answer": "A"}, {"id": "p3q9", "n": 9, "subj": "mat", "tag": "Binomial: esperança e variância", "pts": 4, "stem": "Um job de ETL é executado 10 vezes por dia e cada execução falha de forma independente com probabilidade 0,3. Seja X o número de falhas no dia. Avalie:\n\nI. E(X) = 3.\n\nII. Var(X) = 3.\n\nIII. P(X = 0) ≈ 2,8%.\n\nIV. O desvio-padrão de X é aproximadamente 1,45.\n\nEstão corretas:", "expl": "E = np = 3; Var = np(1 − p) = 10·0,3·0,7 = **2,1** (II falsa); P(0) = 0,7¹⁰ ≈ 0,0282; σ = √2,1 ≈ 1,45.", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas I, III e IV."], ["C", "Apenas II e III."], ["D", "Apenas II e IV."], ["E", "As afirmações I, II, III e IV."]], "answer": "B"}, {"id": "p3q10", "n": 10, "subj": "mat", "tag": "Distribuição uniforme", "pts": 4, "stem": "O tempo de inferência X de um modelo segue distribuição uniforme contínua entre 10 ms e 50 ms. Avalie:\n\nI. A densidade vale f(x) = 1/40 para x ∈ [10, 50].\n\nII. P(X < 20) = 25%.\n\nIII. E(X) = 30 ms.\n\nIV. O desvio-padrão de X é 40/12 ms.\n\nEstão corretas:", "expl": "f = 1/(b − a) = 1/40; P(X < 20) = 10/40 = 25%; E = (10 + 50)/2 = 30. IV é falsa: Var = (b − a)²/12 = 1600/12 ≈ 133,3, e σ ≈ 11,55 ms.", "type": "mc", "options": [["A", "Apenas I e IV."], ["B", "Apenas II e IV."], ["C", "Apenas I, II e III."], ["D", "Apenas III e IV."], ["E", "As afirmações I, II, III e IV."]], "answer": "C"}, {"id": "p3q11", "n": 11, "subj": "mat", "tag": "Tamanho de amostra", "pts": 4, "stem": "Uma equipe quer estimar o consumo médio de energia de um data center, sabendo que σ = 15 kWh. Deseja margem de erro máxima de 2 kWh, com 99% de confiança (z = 2,58). Qual é o tamanho mínimo da amostra?", "expl": "n = (z·σ/E)² = (2,58·15/2)² = 19,35² ≈ 374,4 → arredonda **para cima**: 375.", "type": "mc", "options": [["A", "19"], ["B", "188"], ["C", "374"], ["D", "375"], ["E", "1.500"]], "answer": "D"}, {"id": "p3q12", "n": 12, "subj": "mat", "tag": "Ponto crítico", "pts": 4, "stem": "A função de custo de um modelo é f(x, y) = x² + y² − 4x + 6y + 20. O ponto crítico e sua natureza são:", "expl": "f_x = 2x − 4 = 0 → x = 2; f_y = 2y + 6 = 0 → y = −3. f(2, −3) = 4 + 9 − 8 − 18 + 20 = 7. Ambas as segundas derivadas são positivas: mínimo.", "type": "mc", "options": [["A", "(−2, 3), com f = 59, mínimo."], ["B", "(2, 3), com f = 43, mínimo."], ["C", "(2, −3), com f = 7, máximo."], ["D", "(4, −6), com f = 20, mínimo."], ["E", "(2, −3), com f = 7, mínimo (f_xx = 2 > 0 e f_yy = 2 > 0)."]], "answer": "E"}, {"id": "p3q13", "n": 13, "subj": "mat", "tag": "Integral tripla", "pts": 4, "stem": "A densidade de um bloco de dados é ρ(x, y, z) = x·y·z, em x ∈ [0, 1], y ∈ [0, 2] e z ∈ [0, 3]. A massa total ∭ ρ dV vale:", "expl": "Função separável em região retangular: (∫₀¹ x dx)·(∫₀² y dy)·(∫₀³ z dz) = 0,5 · 2 · 4,5 = **4,5**.", "type": "mc", "options": [["A", "4,5"], ["B", "9"], ["C", "13,5"], ["D", "2,25"], ["E", "27"]], "answer": "A"}, {"id": "p3q14", "n": 14, "subj": "mat", "tag": "Matriz padrão", "pts": 4, "stem": "Em um pipeline de IA, a transformação T: ℝ³ → ℝ² é dada por T(x, y, z) = (2x − y + z, 3y − 4z). Qual é a sua matriz padrão? (Cada linha é escrita entre colchetes.)", "expl": "As colunas são as imagens da base padrão: T(e₁) = (2, 0), T(e₂) = (−1, 3), T(e₃) = (1, −4). A matriz é 2×3: [[2, −1, 1], [0, 3, −4]]. A primeira opção é a transposta (as imagens viraram linhas).", "type": "mc", "options": [["A", "[ [2, 0], [−1, 3], [1, −4] ]"], ["B", "[ [2, −1, 1], [0, 3, −4] ]"], ["C", "[ [2, −1, 1], [3, −4, 0] ]"], ["D", "[ [2, 1, −1], [0, 3, −4] ]"], ["E", "[ [1, −1, 2], [0, 3, −4] ]"]], "answer": "B"}, {"id": "p3q15", "n": 15, "subj": "prog", "tag": "Data Lake, Data Warehouse e ETL/ELT", "pts": 4, "stem": "Uma varejista consolida dados de e-commerce, ERP e planilhas. Avalie:\n\nI. Um Data Lake armazena dados brutos e variados, com esquema definido depois, e é usado em exploração e ciência de dados.\n\nII. Um Data Warehouse armazena dados estruturados e curados, com esquema definido, para BI e análises recorrentes.\n\nIII. No ELT, os dados são transformados antes de serem carregados no destino.\n\nIV. A escolha entre ETL e ELT independe de governança, latência, custo e capacidade da plataforma.\n\nEstão corretas:", "expl": "III é falsa: no **ETL** a transformação ocorre antes do destino; no **ELT** carrega-se primeiro e o destino transforma. IV é falsa: a escolha depende de governança, latência, custo e capacidade.", "type": "mc", "options": [["A", "Apenas I e III."], ["B", "Apenas II e IV."], ["C", "Apenas I e II."], ["D", "Apenas III e IV."], ["E", "Apenas I, II e III."]], "answer": "C"}, {"id": "p3q16", "n": 16, "subj": "prog", "tag": "PCA e variância explicada", "pts": 4, "stem": "Dois atributos padronizados (juros e inflação) têm matriz de covariância [[5, 3], [3, 5]], cujos autovalores são 8 e 2. Que proporção da variância total é explicada pelo primeiro componente principal?", "expl": "A variância total é a soma dos autovalores (8 + 2 = 10, igual ao traço). O CP1 explica 8/10 = **80%**. O autovalor maior indica a direção com mais informação estrutural.", "type": "mc", "options": [["A", "20%"], ["B", "62,5%"], ["C", "50%"], ["D", "80%"], ["E", "100%"]], "answer": "D"}, {"id": "p3q17", "n": 17, "subj": "prog", "tag": "K-means: uma iteração", "pts": 4, "stem": "Pontos: A(1, 1), B(2, 1), C(4, 4) e D(5, 5). Executa-se K-means com K = 2 e centróides iniciais (1, 1) e (5, 5). Após a primeira atribuição e a atualização dos centróides, os novos centróides são:", "expl": "Atribuição: A e B ficam com (1, 1); C e D com (5, 5) (C está a √2 de (5, 5) e a √18 de (1, 1)). Atualização = média do grupo: ((1+2)/2, (1+1)/2) = (1,5; 1,0) e ((4+5)/2, (4+5)/2) = (4,5; 4,5).", "type": "mc", "options": [["A", "(1,5; 1,0) e (5,0; 5,0)"], ["B", "(2,0; 2,0) e (4,0; 4,0)"], ["C", "(1,0; 1,0) e (4,5; 4,5)"], ["D", "(1,5; 1,5) e (4,5; 4,5)"], ["E", "(1,5; 1,0) e (4,5; 4,5)"]], "answer": "E"}, {"id": "p3q18", "n": 18, "subj": "prog", "tag": "KNN", "pts": 4, "stem": "Um banco classifica clientes (X1, X2) em \"Sim\" ou \"Não\" para inadimplência com KNN (distância euclidiana). Base de treino:\n\n| Ponto | X1 | X2 | Classe |\n|---|---|---|---|\n| P1 | 2 | 3 | Sim |\n| P2 | 3 | 3 | Sim |\n| P3 | 6 | 6 | Não |\n| P4 | 7 | 7 | Não |\n| P5 | 3 | 4 | Não |\n\nO novo cliente é (4, 4). A classe prevista para k = 1, k = 3 e k = 5, respectivamente, é:", "expl": "Distâncias a (4, 4): P5 = 1,00 (Não); P2 = 1,41 (Sim); P1 = 2,24 (Sim); P3 = 2,83 (Não); P4 = 4,24 (Não). k = 1: Não. k = 3: Não, Sim, Sim → **Sim**. k = 5: 2 Sim × 3 Não → **Não**. O resultado muda com k.", "type": "mc", "options": [["A", "Não, Sim, Não"], ["B", "Sim, Sim, Sim"], ["C", "Não, Não, Sim"], ["D", "Sim, Não, Não"], ["E", "Não, Sim, Sim"]], "answer": "A"}, {"id": "p3q19", "n": 19, "subj": "prog", "tag": "Boxplot comparativo", "pts": 4, "stem": "Os boxplots abaixo comparam a latência (ms) de um serviço nos turnos A e B.\n\n{{box:latência (ms)|Turno A,20,30,40,50,65|Turno B,25,40,60,90,130,190}}\n\nAvalie:\n\nI. A mediana da latência do turno B é maior do que a do turno A.\n\nII. O turno B tem maior variabilidade: seu IQR é 50 ms e o do turno A é 20 ms.\n\nIII. O turno A possui um valor atípico acima do bigode.\n\nIV. No turno B, 190 ms é atípico, pois excede Q3 + 1,5·IQR = 165 ms.\n\nEstão corretas:", "expl": "Mediana: B = 60 > A = 40. IQR: B = 90 − 40 = 50; A = 50 − 30 = 20. O turno A não exibe pontos isolados (o máximo é 65). Em B, o limite é 90 + 1,5·50 = 165 e 190 o excede.", "type": "mc", "options": [["A", "Apenas I e II."], ["B", "Apenas I, II e IV."], ["C", "Apenas III e IV."], ["D", "Apenas II e III."], ["E", "As afirmações I, II, III e IV."]], "answer": "B"}, {"id": "p3q20", "n": 20, "subj": "prog", "tag": "Regressão linear", "pts": 4, "stem": "Uma equipe ajustou um modelo de regressão linear simples para prever as vendas mensais (mil unidades) de um segmento em função do investimento em marketing x (R$ mil): ŷ = 12 + 3,5·x. Em um mês em que x = 8, as vendas reais foram 46. Avalie:\n\nI. Cada R$ 1 mil adicional em marketing está associado a um aumento previsto de 3,5 mil unidades nas vendas.\n\nII. Para x = 8, a previsão do modelo é de 40 mil unidades.\n\nIII. O resíduo (real − previsto) nesse mês é −6.\n\nIV. O R² mede o erro médio absoluto, na mesma unidade da variável-alvo.\n\nEstão corretas:", "expl": "ŷ(8) = 12 + 3,5·8 = 40. Resíduo = 46 − 40 = **+6** (III falsa). O R² é a proporção da variância explicada em relação à referência da média; quem mede o erro médio absoluto na unidade do alvo é o **MAE** (IV falsa).", "type": "mc", "options": [["A", "Apenas I e III."], ["B", "Apenas II e IV."], ["C", "Apenas I e II."], ["D", "Apenas III e IV."], ["E", "Apenas I, II e III."]], "answer": "C"}, {"id": "p3q21", "n": 21, "subj": "mat", "tag": "Autovalores e diagonalização", "pts": 10, "stem": "Na fase de pré-processamento de um modelo preditivo, a matriz de covariância entre dois atributos (custo e receita) é A = [[7, 2], [2, 4]] (primeira linha 7 e 2; segunda linha 2 e 4).\n\n(a) Monte A − λI, escreva a equação característica e encontre os autovalores.\n(b) Calcule um autovetor para cada autovalor.\n(c) Construa P e D da diagonalização A = PDP⁻¹ e calcule P⁻¹.\n(d) O modelo pr
