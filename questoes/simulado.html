es tem função de perda L(x, y) = 4x³y² − 7x + 2y, em que x e y são dois pesos do modelo. Na atualização por gradiente, a derivada parcial ∂L/∂x é:", "options": [["a", "12x²y² − 7"], ["b", "12x²y² − 5"], ["c", "12x²y − 7"], ["d", "8x³y − 7"], ["e", "12x²y² − 7x"]], "answer": "a", "id": "mat4"}, {"n": 5, "level": 1, "tag": "Binomial", "expl": "C(4,2)·(1/2)⁴ = 6/16 = 0,375.", "type": "mc", "stem": "Um lote de inspeção usa 4 classificadores independentes em paralelo, e cada um gera um falso positivo com probabilidade 1/2. Qual a probabilidade de exatamente 2 deles gerarem falso positivo?", "options": [["a", "0,250"], ["b", "0,375"], ["c", "0,500"], ["d", "0,125"], ["e", "0,750"]], "answer": "b", "id": "mat5"}, {"n": 6, "level": 1, "tag": "Uniforme", "expl": "Comprimento 10 / total 40 = 25%.", "type": "mc", "stem": "O tempo de inferência de um modelo de previsão de demanda segue uma Uniforme Contínua em [0, 40] ms. O painel de MLOps dispara alerta de lentidão acima de 30 ms. Qual é P(X > 30)?", "options": [["a", "10%"], ["b", "25%"], ["c", "30%"], ["d", "75%"], ["e", "33%"]], "answer": "b", "id": "mat6"}, {"n": 7, "level": 1, "tag": "Escore Z", "expl": "z = (250 − 200)/25 = 2.", "type": "mc", "stem": "A latência de um serviço de inferência tem média 200 ms e desvio-padrão 25 ms. Na padronização de features (Escore Z), qual o escore de uma requisição de 250 ms?", "options": [["a", "0,5"], ["b", "2"], ["c", "50"], ["d", "−2"], ["e", "1,25"]], "answer": "b", "id": "mat7"}, {"n": 8, "level": 1, "tag": "TLC e erro-padrão", "expl": "(01) V. (02) V: √4 = 2, o erro cai pela metade. (04) F: o TLC fala da distribuição das **médias**, não da população. → 1 + 2 = 3.", "type": "soma", "stem": "Um pipeline de monitoramento (MLOps) avalia a latência do modelo em produção por médias amostrais. Sobre o TLC e o erro-padrão:", "items": [[1, "O erro-padrão da média é σ/√n."], [2, "Quadruplicar o tamanho da amostra reduz o erro-padrão à metade."], [4, "O TLC afirma que a população se torna normal quando a amostra é grande."]], "answer": 3, "id": "mat8"}, {"n": 9, "level": 1, "tag": "Integral dupla", "expl": "∫₀³ 4x dx = 18; vezes a largura em y (2) = 36.", "type": "mc", "stem": "A carga de transações de um servidor de recomendação é modelada por R(x, y) = 4x sobre a região retangular x ∈ [0, 3] e y ∈ [0, 2]. Calcule o volume total ∬ R dA.", "options": [["a", "12"], ["b", "24"], ["c", "36"], ["d", "48"], ["e", "72"]], "answer": "c", "id": "mat9"}, {"n": 10, "level": 1, "tag": "Transformações lineares", "expl": "A = [[3, −1], [1, 2]]. det = 3·2 − (−1)(1) = 7. (5 vem de errar o sinal.)", "type": "mc", "stem": "Na engenharia de atributos do projeto MAHLE, dois indicadores econômicos são projetados por T(x, y) = (3x − y, x + 2y) (transformação de pré-processamento). Qual é o determinante da matriz padrão de T?", "options": [["a", "5"], ["b", "6"], ["c", "7"], ["d", "−7"], ["e", "1"]], "answer": "c", "id": "mat10"}, {"n": 11, "level": 2, "tag": "Transformações lineares", "expl": "(01) V. (02) F: T(0,0) = (1,0) ≠ (0,0). (04) F: são as **colunas**. → 1.", "type": "soma", "stem": "Uma equipe implementa etapas de pré-processamento de um pipeline de IA como transformações de vetores. Sobre transformações lineares:", "items": [[1, "Se T é linear, então T(0, 0) = (0, 0)."], [2, "T(x, y) = (x + 1, y) é linear."], [4, "Na matriz padrão, as imagens T(e₁) e T(e₂) formam as **linhas** da matriz."]], "answer": 1, "id": "mat11"}, {"n": 12, "level": 2, "tag": "Normal e tabela Z", "expl": "z = (130 − 100)/20 = 1,5 → tabela 0,9332.", "type": "mc", "stem": "Um modelo de manutenção preditiva estima que a vida útil restante de uma frota de motores segue uma Normal com média 100 h e desvio-padrão 20 h. Usando a tabela, qual é a probabilidade de a vida útil ser menor que 130 h?", "options": [["a", "84,13%"], ["b", "93,32%"], ["c", "97,72%"], ["d", "6,68%"], ["e", "50,00%"]], "answer": "b", "id": "mat12"}, {"n": 13, "level": 2, "tag": "Binomial", "expl": "1 − P(0 falhas) = 1 − 0,8⁵ = 1 − 0,32768 = 0,6723.", "type": "mc", "stem": "Um job de treinamento de IA é executado 5 vezes de forma independente, e cada execução falha com probabilidade 0,2. Qual a probabilidade de **pelo menos uma** execução falhar?", "options": [["a", "0,2000"], ["b", "0,3277"], ["c", "0,4096"], ["d", "0,6723"], ["e", "1,0000"]], "answer": "d", "id": "mat13"}, {"n": 14, "level": 2, "tag": "Tamanho de amostra", "expl": "n = (1,96·25/5)² = 9,8² = 96,04 → arredonda **para cima** = 97.", "type": "mc", "stem": "Um analista de nuvem quer estimar o consumo médio de memória com margem de erro máxima E = 5 GB. O desvio-padrão populacional é σ = 25 GB e a confiança é de 95% (Z = 1,96). O tamanho mínimo da amostra é:", "options": [["a", "25"], ["b", "49"], ["c", "96"], ["d", "97"], ["e", "385"]], "answer": "d", "id": "mat14"}, {"n": 15, "level": 2, "tag": "Intervalo de confiança", "expl": "EP = 30/√100 = 3; E = 1,96·3 = 5,88 → [194,12; 205,88]. (a) usa σ sem dividir por √n; (e) usa EP = 2.", "type": "mc", "stem": "Um teste com n = 100 requisições mediu latência média de 200 ms, com σ = 30 ms (conhecido). O intervalo de confiança de 95% (Z = 1,96) para a latência média é:", "options": [["a", "[141,20; 258,80]"], ["b", "[197,06; 202,94]"], ["c", "[194,12; 205,88]"], ["d", "[190,00; 210,00]"], ["e", "[196,08; 203,92]"]], "answer": "c", "id": "mat15"}, {"n": 16, "level": 2, "tag": "Teste de hipóteses", "expl": "(01) F: isso é erro Tipo II. (02) F: Hₐ nunca tem igualdade. (04) V.", "type": "soma", "stem": "A equipe de engenharia faz um Teste A/B para saber se o novo modelo de previsão de demanda reduz o tempo de processamento. Sobre o teste de hipóteses:", "items": [[1, "O erro Tipo I consiste em não rejeitar H₀ quando ela é falsa."], [2, "A hipótese alternativa Hₐ pode conter o sinal de igualdade."], [4, "Se o p-valor é menor que α, rejeita-se H₀."]], "answer": 4, "id": "mat16"}, {"n": 17, "level": 2, "tag": "Teste t", "expl": "EP = 15/√25 = 3; t = (96 − 100)/3 = −1,33.", "type": "mc", "stem": "Por restrição de orçamento de nuvem, uma simulação rodou só n = 25 baterias de avaliação. O desvio-padrão populacional é desconhecido; a amostra teve média de 96 requisições e desvio-padrão amostral s = 15. A meta é μ₀ = 100. Usando a distribuição t, a estatística de teste é:", "options": [["a", "−4,00"], ["b", "−0,27"], ["c", "−1,33"], ["d", "1,33"], ["e", "−0,80"]], "answer": "c", "id": "mat17"}, {"n": 18, "level": 2, "tag": "Domínio", "expl": "Log exige argumento **estritamente** positivo: 4 − x² − y² > 0 → disco aberto.", "type": "mc", "stem": "Um modelo de risco de queda de servidor usa g(x, y) = ln(4 − x² − y²), em que x é o tráfego normalizado e y é a latência normalizada. As entradas fora do domínio real são rejeitadas. O domínio válido é:", "options": [["a", "x² + y² ≤ 4"], ["b", "x² + y² < 4"], ["c", "x² + y² > 4"], ["d", "x² + y² ≥ 4"], ["e", "todo o plano ℝ²"]], "answer": "b", "id": "mat18"}, {"n": 19, "level": 2, "tag": "Curvas de nível", "expl": "x²/16 + y²/4 = 1 → elipse de semieixos 4 e 2.", "type": "mc", "stem": "Um algoritmo de precificação de nuvem usa C(x, y) = x² + 4y², em que x é processamento e y é armazenamento. A diretoria quer as combinações de custo fixo k = 16. A curva de nível é:", "options": [["a", "circunferência de raio 4"], ["b", "elipse de semieixos 4 e 2"], ["c", "hipérbole"], ["d", "parábola"], ["e", "par de retas paralelas"]], "answer": "b", "id": "mat19"}, {"n": 20, "level": 2, "tag": "Autovalores", "expl": "tr = 7, det = 12 − 2 = 10 → λ² − 7λ + 10 = 0 → λ = 2 e 5.", "type": "mc", "stem": "No projeto MAHLE, dois indicadores correlacionados (juros e inflação) passam por uma transformação cuja matriz é A = [[4, 1], [2, 3]]. Os autovalores de A são:", "options": [["a", "1 e 6"], ["b", "2 e 5"], ["c", "3 e 4"], ["d", "−2 e −5"], ["e", "7 e 10"]], "answer": "b", "id": "mat20"}, {"n": 21, "level": 3, "tag": "Integral em região", "expl": "(01) F: y vai de 0 a 2x. (02) V: y = 2x ⇒ x = y/2; y máximo é 6 (em x = 3). (04) V: base 3 × altura 6 / 2 = 9. → 2 + 4 = 6.", "type": "soma", "stem": "Um modelo preditivo processa o risco de tráfego numa fronteira triangular D, delimitada pelo eixo y = 0, pela reta x = 3 e pela reta y = 2x, com densidade de carga f(x, y).", "items": [[1, "Na ordem dy dx, y varia de 0 a 3 (limites fixos)."], [2, "Na ordem dx dy, 0 ≤ y ≤ 6 e y/2 ≤ x ≤ 3."], [4, "A área de D vale 9."]], "answer": 6, "id": "mat21"}, {"n": 22, "level": 3, "tag": "Integral em região", "expl": "Interna: ∫₀ˣ (x + y) dy = x² + x²/2 = 3x²/2. Externa: ∫₀² 3x²/2 dx = x³/2 |₀² = 4.", "type": "mc", "stem": "A carga de processamento de um motor de anomalias é f(x, y) = x + y, integrada sobre a região triangular D = {0 ≤ x ≤ 2, 0 ≤ y ≤ x}. O escore agregado ∬ f dA é:", "options": [["a", "2"], ["b", "4"], ["c", "6"], ["d", "8"], ["e", "12"]], "answer": "b", "id": "mat22"}, {"n": 23, "level": 3, "tag": "Derivadas parciais", "expl": "(01) V. (02) F: f_y = 3x²y². (04) V: f_xy = ∂/∂y(2xy³) = 6xy² e Clairaut vale para polinômios. → 1 + 4 = 5.", "type": "soma", "stem": "Uma IA de precificação dinâmica tem custo computacional f(x, y) = x²y³, e os desenvolvedores analisam sua sensibilidade às entradas por derivadas parciais.", "items": [[1, "f_x = 2xy³."], [2, "f_y = 2x²y²."], [4, "f_xy = f_yx = 6xy²."]], "answer": 5, "id": "mat23"}, {"n": 24, "level": 3, "tag": "Regra da cadeia", "expl": "∂z/∂x = y³, dx/dt = 2t, ∂z/∂y = 3xy², dy/dt = 1. Em t = 1: x = 1, y = 2 → 8·2 + 3·1·4·1 = 16 + 12 = 28. Conferindo: z = t²(t+1)³, z′(1) = 2·8 + 3·4 = 28.", "type": "mc", "stem": "A produção prevista de um modelo é z = x·y³, em que x é o tráfego e y é a latência, ambos variando no tempo: x(t) = t² e y(t) = t + 1. Pela regra da cadeia, dz/dt em t = 1 vale:", "options": [["a", "16"], ["b", "20"], ["c", "24"], ["d", "28"], ["e", "32"]], "answer": "d", "id": "mat24"}, {"n": 25, "level": 3, "tag": "Otimização", "expl": "L_x = 40 − 4x = 0 → x = 10. L_y = 24 − 6y = 0 → y = 4. L_xx = −4 < 0 e L_yy = −6 < 0 (máximo). L = 400 + 96 − 200 − 48 = 248.", "type": "mc", "stem": "No projeto MAHLE, o lucro previsto (em R$ mil) de uma linha de produção, em função das horas de dois turnos x e y, é L(x, y) = 40x + 24y − 2x² − 3y². O valor máximo de L é:", "options": [["a", "152"], ["b", "200"], ["c", "248"], ["d", "296"], ["e", "344"]], "answer": "c", "id": "mat25"}, {"n": 26, "level": 3, "tag": "Volume sob a superfície", "expl": "Verificação: mínimo de z em (1, 2) = 10 − 2 − 2 = 6 > 0. Interna em y: 20 − 4x − 2 = 18 − 4x. Externa: ∫₀¹ (18 − 4x) dx = 18 − 2 = 16.", "type": "mc", "stem": "O volume de transações de alto risco interceptadas por um cluster de IA é determinado integrando a superfície z = 10 − 2x − y sobre a região R = [0, 1] × [0, 2]. O volume total é:", "options": [["a", "8"], ["b", "12"], ["c", "16"], ["d", "18"], ["e", "20"]], "answer": "c", "id": "mat26"}, {"n": 27, "level": 3, "tag": "Integral dupla", "expl": "Separável em retângulo: ∫₀¹ e^(2x) dx = (e² − 1)/2 e ∫₀³ 2y dy = 9 → 9(e² − 1)/2.", "type": "mc", "stem": "Uma função de densidade modela falhas simultâneas em contêineres: f(x, y) = 2y·e^(2x) sobre R = [0, 1] × [0, 3]. A IA integra essa distribuição sobre R. O resultado é:", "options": [["a", "9(e² − 1)/2"], ["b", "9(e² − 1)"], ["c", "9e²/2"], ["d", "3(e² − 1)/2"], ["e", "9(e − 1)/2"]], "answer": "a", "id": "mat27"}, {"n": 28, "level": 3, "tag": "Teste z", "expl": "EP = 20/√100 = 2. (01) F (o denominador é 2). (02) V: z = 5/2 = 2,5. (04) V: 2,5 > 1,96. → 2 + 4 = 6.", "type": "soma", "stem": "Uma plataforma de IA analisa o risco de saída de clientes corporativos. A meta de retenção é μ₀ = 50, com desvio populacional σ = 20 (conhecido). O módulo analisou n = 100 clientes e reportou média amostral 55. Teste bilateral com Z crítico = ±1,96.", "items": [[1, "O denominador da estatística Z vale 20."], [2, "Z_teste = 2,5."], [4, "H₀ é rejeitada."]], "answer": 6, "id": "mat28"}, {"n": 29, "level": 3, "tag": "Diagonalização", "expl": "Triangular: λ = 2 e 3. Autovetores: (1,0) e (1,1). P = [[1,1],[0,1]], P⁻¹ = [[1,−1],[0,1]], D³ = diag(8, 27). PD³ = [[8,27],[0,27]]; vezes P⁻¹ = [[8,19],[0,27]]. Elemento (1,2) = 19. Conferindo: A² = [[4,5],[0,9]], A³ = A²·A = [[8,19],[0,27]].", "type": "mc", "stem": "Um pipeline propaga dados por 3 etapas de tempo com a matriz A = [[2, 1], [0, 3]]. Usando A = PDP⁻¹, o elemento da linha 1, coluna 2 de A³ é:", "options": [["a", "8"], ["b", "9"], ["c", "13"], ["d", "19"], ["e", "27"]], "answer": "d", "id": "mat29"}, {"n": 30, "level": 3, "tag": "Autovalores e autovetores", "expl": "tr = 9, det = 14 → λ² − 9λ + 14 = 0 → 7 e 2. (01) V. (02) V: A(1,−2) = (6−4, 2−6) = (2, −4) = 2·(1,−2). (04) F: os autovalores de A² são os **quadrados**: 49 e 4. → 1 + 2 = 3.", "type": "soma", "stem": "Na fase de pré-processamento, a IA calcula a matriz de covariância de dois atributos correlacionados, custo e receita: A = [[6, 2], [2, 3]].", "items": [[1, "Os autovalores de A são 7 e 2."], [2, "v = (1, −2) é autovetor associado a λ = 2."], [4, "Os autovalores de A² são 14 e 4."]], "answer": 3, "id": "mat30"}]}, {"id": "prog", "name": "Programação", "short": "Programação", "c": "prog", "q": [{"n": 1, "level": 1, "tag": "Tipos e operadores", "type": "open", "stem": "No script de ingestão dos dados de emplacamento (ANFAVEA) do projeto MAHLE, um analista testa alguns operadores no console. Qual é a saída?\n```python\nprint(type(7/2), 7//2, 7%2, \"3\"+\"4\")\n```", "expl": "`<class 'float'> 3 1 34`. `/` sempre devolve float; `//` é divisão inteira; `%` é resto; `\"3\"+\"4\"` concatena strings.", "id": "prog1"}, {"n": 2, "level": 1, "tag": "Laço while", "type": "open", "stem": "Um script controla o estoque de peças de um lote: `s` acumula as peças expedidas e `c` é o estoque restante. Faça o teste de mesa (iteração, `c`, `s`) e dê a saída.\n```python\ns = 0\nc = 10\nwhile c > 0:\n    s += c\n    c -= 3\nprint(s, c)\n```", "expl": "Iterações: (c=10, s=10) → (c=7, s=17) → (c=4, s=21) → (c=1, s=22) → c vira −2 e o laço termina. Saída: `22 -2`.", "id": "prog2"}, {"n": 3, "level": 1, "tag": "Listas", "type": "open", "stem": "A lista `n` guarda as vendas mensais (em mil unidades) de um segmento de veículos. Qual é a saída?\n```python\nn = [8, 6, 9, 5]\nn.append(7)\nn.insert(0, 10)\nprint(n, n[1:4], n[-2:], sum(n)/len(n), max(n))\n```", "expl": "Após `append(7)` e `insert(0,10)`: `[10, 8, 6, 9, 5, 7]`. Saída: `[10, 8, 6, 9, 5, 7] [8, 6, 9] [5, 7] 7.5 10` (soma 45 / 6 = 7,5).", "id": "prog3"}, {"n": 4, "level": 1, "tag": "Dicionários", "type": "open", "stem": "O dicionário `d` guarda a configuração de um experimento de modelagem. Qual é a saída?\n```python\nd = {\"a\": 1, \"b\": [2, 3]}\nd[\"c\"] = d[\"a\"] + len(d[\"b\"])\nd[\"a\"] += 5\nprint(d, list(d.keys()), d[\"b\"][-1])\n```", "expl": "`d[\"c\"] = 1 + 2 = 3`; `d[\"a\"]` vira 6. Saída: `{'a': 6, 'b': [2, 3], 'c': 3} ['a', 'b', 'c'] 3`.", "id": "prog4"}, {"n": 5, "level": 1, "tag": "Conjuntos e tuplas", "type": "open", "stem": "Duas fábricas atendem conjuntos de montadoras. (a) Dê a saída de `print(sorted(A & B), sorted(A | B), sorted(A - B), len(A | B))` com `A = {\"x\",\"y\",\"z\"}` e `B = {\"z\",\"w\"}`, e diga o que cada operador representa no negócio.\n(b) Dado `t = (1, 2)` (par de coordenadas de um sensor), qual a saída de `t2 = t + (3, 4); print(t2, len(t2), t2[1:3])` e o que acontece com `t[0] = 9`? Por quê?", "expl": "(a) `['z'] ['w', 'x', 'y', 'z'] ['x', 'y'] 4`. `&` = montadoras atendidas pelas **duas** fábricas (interseção); `|` = total de montadoras **distintas** (união); `-` = atendidas só pela fábrica A (diferença). (b) `(1, 2, 3, 4) 4 (2, 3)`. `t[0] = 9` gera `TypeError`: tuplas são **imutáveis**; a soma cria uma tupla nova.", "id": "prog5"}, {"n": 6, "level": 1, "tag": "Funções", "type": "open", "stem": "Uma função estima o custo de uma peça segundo o tipo (`p` é a quantidade). Qual é a saída de cada chamada?\n```python\ndef f(p, tipo):\n    if tipo == \"a\":\n        fator = 2\n    elif tipo == \"b\":\n        fator = 5\n    else:\n        return \"inválido\"\n    return p * fator\n\nprint(f(4, \"b\"), f(4, \"c\"), f(3, \"a\"))\n```", "expl": "`20 inválido 6`.", "id": "prog6"}, {"n": 7, "level": 1, "tag": "NumPy", "type": "open", "stem": "Um analista calcula o faturamento por segmento com NumPy e compara com uma lista comum. Dê a saída e explique a diferença entre lista e array.\n```python\nimport numpy as np\nl = [1, 2, 3];  a = np.array([1, 2, 3])\nprint(l*2, a*2, a[a > 1], a.mean(), a.shape)\n```", "expl": "`[1, 2, 3, 1, 2, 3] [2 4 6] [2 3] 2.0 (3,)`. Lista `*2` **repete** a sequência; array `*2` multiplica **cada elemento** (vetorização). A máscara `a > 1` seleciona elementos.", "id": "prog7"}, {"n": 8, "level": 1, "tag": "Pandas", "type": "open", "stem": "Dado o DataFrame de vendas por segmento do projeto MAHLE, dê a saída dos dois trechos.\n```python\ndf = pd.DataFrame({\"segmento\":[\"SUV\",\"Sedan\",\"SUV\",\"Pickup\",\"Sedan\"],\n                   \"vendas\":[10,20,30,40,50],\n                   \"desc\":[0.1,0.2,0.05,0.3,0.1]})", "expl": "(a) Linhas 2 e 4 (vendas > 15 e desc ≤ 0,1): `SUV, 30` e `Sedan, 50`. (b) `SUV: total 40, med 20.0`; `Sedan: total 70, med 35.0`; `Pickup: total 40, med 40.0`. Parênteses: `&` tem precedência maior que `>`/`<=`; sem eles dá erro.", "id": "prog8"}, {"n": 9, "level": 1, "tag": "Média vs mediana", "type": "open", "stem": "Na telemetria de uma API de previsão de demanda, a coluna `tempo_resposta` (em ms) tem os valores `[4, 6, 5, 100, 5]` e mais um registro ausente (NaN) a preencher com `fillna`. (a) Calcule média e mediana. (b) Qual você usaria no `fillna` e por quê? (c) O 100 deve ser apagado automaticamente? Justifique.", "expl": "(a) Média = 24; mediana = 5. (b) **Mediana**: robusta a extremos; a média (24) não representa nenhum valor típico. (c) Não. Outlier é pista, não veredito: verificar origem/unidade/digitação; pode ser erro, evento raro ou sinal valioso.", "id": "prog9"}, {"n": 10, "level": 1, "tag": "Outliers (IQR)", "type": "open", "stem": "Na base de emplacamentos do projeto MAHLE, as vendas mensais (em mil unidades) de um segmento são `[4, 5, 6, 7, 8, 9, 10, 11, 12, 60]`. Aplique a regra do IQR (quartis por interpolação linear, padrão do pandas/NumPy: Q1 = 6,25 e Q3 = 10,75): calcule IQR, os limites inferior e superior e diga quais valores são outliers. O que o critério faz e o que ele **não** faz? O que você investigaria antes de remover o 60?", "expl": "IQR = 10,75 − 6,25 = 4,5. Limite inferior = 6,25 − 1,5·4,5 = −0,5; superior = 10,75 + 1,5·4,5 = 17,5. Outlier: **60**. O critério **sinaliza**; a decisão (manter, limitar, transformar, remover) depende do contexto.", "id": "prog10"}, {"n": 11, "level": 2, "tag": "Escalonamento", "type": "open", "stem": "A feature `preco_medio` (em mil R$) de cinco modelos de veículos é `x = [20, 30, 40, 50, 60]` (média 40; desvio-padrão populacional ≈ 14,14). (a) Padronize o valor 60 (StandardScaler). (b) Aplique Min-Max ao valor 30. (c) Qual dos dois é mais sensível a outliers e por quê? (d) Escalonar torna a feature mais importante para o modelo?", "expl": "(a) z = (60 − 40)/14,14 ≈ **1,41**. (b) (30 − 20)/(60 − 20) = **0,25**. (c) **Min-Max**: usa mín e máx, então um extremo comprime todo o resto. (d) Não: só muda a unidade; evita que uma variável em escala grande domine métodos sensíveis à escala (KNN, K-means, PCA).", "id": "prog11"}, {"n": 12, "level": 2, "tag": "Encoding", "type": "open", "stem": "A base do projeto de previsão de vendas tem `segmento` (SUV, Sedan, Pickup), `nivel_juros` (baixo < médio < alto), `renda_media` (numérica, com ausentes) e `comprou` (sim/não, o alvo). Para cada coluna indique o tratamento (imputação, encoding, escala), explique por que **não** se deve codificar `segmento` como 1, 2, 3, e onde o `LabelEncoder` é apropriado.", "expl": "`segmento` (nominal): imputar (mais frequente) + **One-Hot**. `nivel_juros` (ordinal): codificação ordinal (baixo=0 < médio=1 < alto=2). `renda_media`: imputar (mediana, se há outliers) + escalar. `comprou`: é o alvo y. 1,2,3 em `segmento` inventaria ordem/distância que não existe. `LabelEncoder` foi feito para o **alvo y**, não para colunas de X.", "id": "prog12"}, {"n": 13, "level": 2, "tag": "ETL e Data Lake", "type": "open", "stem": "A MAHLE junta dados de um ERP, sensores da linha de produção e planilhas de fornecedores, para análises recorrentes de BI e também para experimentos de ciência de dados. (a) Diferencie ETL de ELT. (b) Diferencie Data Lake de Data Warehouse. (c) Recomende uma combinação e justifique.", "expl": "(a) ETL transforma **antes** de carregar; ELT carrega e o destino transforma. (b) Lake: dados brutos e variados, schema depois, exploração/ciência de dados, exige governança. Warehouse: dados estruturados e curados, schema definido, BI recorrente. (c) Combinação: **lake** (bruto, ERP+sensores+planilhas) para ciência de dados e **warehouse** para BI recorrente; ELT no lake (flexibilidade) e ETL curado até o warehouse. Depende de governança, latência, custo, capacidade.", "id": "prog13"}, {"n": 14, "level": 2, "tag": "Data leakage", "type": "open", "stem": "Um engenheiro de ML escreveu o pipeline de treino de um modelo de demanda. Identifique o erro e corrija:\n```python\nscaler = StandardScaler()\nX_scaled = scaler.fit_transform(X)                 # 1\nX_tr, X_te, y_tr, y_te = train_test_split(X_scaled, y, test_size=0.2)   # 2\nmodel.fit(X_tr, y_tr)\n```\nExplique o que é *data leakage* e por que ele infla a avaliação. Escreva a ordem correta.", "expl": "Erro: o `StandardScaler` foi ajustado (`fit`) com **todos** os dados, inclusive o futuro teste, antes do split: a média/desvio do teste vazam para o treino (*data leakage*) e o desempenho medido fica otimista. Correto: `train_test_split` → `scaler.fit_transform(X_tr)` → `scaler.transform(X_te)` (ou tudo dentro de um `Pipeline`). Regra: `fit` só no treino; `transform` em todo o resto.", "id": "prog14"}, {"n": 15, "level": 2, "tag": "CRISP-DM", "type": "open", "stem": "Uma startup de e-commerce quer prever quais pedidos serão devolvidos. Liste as 6 fases do CRISP-DM na ordem e dê **uma atividade concreta** de cada uma para esse projeto. Qual fase costuma consumir cerca de 80% do esforço? Por que o processo não é uma cascata rígida?", "expl": "1 Compreensão do negócio (definir objetivo e critério de sucesso, ex.: reduzir devoluções em X%). 2 Compreensão dos dados (coletar, descrever, avaliar qualidade). 3 Preparação (limpar, integrar, criar features — ~**80%** do esforço). 4 Modelagem (escolher técnicas, treinar, comparar). 5 Avaliação (verificar contra o objetivo de negócio). 6 Implantação (deploy, monitoramento, relatório). Não é cascata rígida: o resultado de uma fase determina a próxima (ex.: modelagem revela problema nos dados → volta à preparação); seguido de forma iterativa é ágil.", "id": "prog15"}, {"n": 16, "level": 2, "tag": "Definir X e y", "type": "open", "stem": "Uma plataforma de streaming quer prever, **no dia 1 do mês**, quais assinantes vão cancelar durante o mês. A base tem:\n\n| Variável | Quando é registrada |\n|---|---|\n| `id_assinante` | no cadastro |\n| `horas_assistidas_mes_anterior` | até o dia 1 |\n| `n_reclamacoes_ultimos_3m` | até o dia 1 |\n| `plano` | até o dia 1 |\n| `motivo_cancelamento` | só existe **após** o cancelamento |\n| `cancelou_no_mes` | ao final do mês |\n\nDefina X e y, justifique cada inclusão/exclusão, aponte a variável que causa *leakage* e explique por que ela só é percebida em produção.", "expl": "y = `cancelou_no_mes`. X = `horas_assistidas_mes_anterior`, `n_reclamacoes_ultimos_3m`, `plano` (existem no dia 1). Excluir `id_assinante` (identificador, sem poder preditivo/generalização). **Leakage: `motivo_cancelamento`** — só existe depois do cancelamento (só é preenchido para quem cancelou), então entrega o alvo. Em desenvolvimento o modelo parece perfeito; em produção a variável não existe no momento da decisão (ou vem vazia) e o desempenho despenca. Pergunta-chave: *eu teria este dado no instante da decisão?*", "id": "prog16"}, {"n": 17, "level": 2, "tag": "Métricas de classificação", "type": "open", "stem": "Um modelo de visão computacional inspeciona pistões na linha de produção da MAHLE e classifica cada peça como defeituosa (positivo) ou boa. Numa amostra de 200 peças, gerou: TP = 30, FP = 10, FN = 20, TN = 140. Calcule acurácia, precisão, recall, F1 e especificidade (mostre as fórmulas). Se um defeito não detectado vai para a montadora cliente, qual métrica priorizar?", "expl": "Acurácia = (30+140)/200 = **0,85**. Precisão = 30/(30+10) = **0,75**. Recall = 30/(30+20) = **0,60**. F1 = 2·0,75·0,60/(0,75+0,60) ≈ **0,667**. Especificidade = 140/(140+10) ≈ **0,933**. Defeito não detectado = falso negativo → priorizar **recall**.", "id": "prog17"}, {"n": 18, "level": 2, "tag": "Paradoxo da acurácia", "type": "open", "stem": "Um banco monitora 1.000 transações, das quais 10 são fraudes. Um modelo \"preguiçoso\" prevê sempre \"não fraude\". (a) Calcule a acurácia e o recall da classe fraude. (b) O que esse resultado mostra? (c) Que métricas e que técnicas (duas) você usaria?", "expl": "(a) Acurácia = 990/1000 = **99%**; recall da classe fraude = 0/10 = **0%**. (b) Paradoxo da acurácia: com classe rara, a acurácia é enganosa; o modelo é inútil. (c) Matriz de confusão, recall, precisão, F1 (e ROC/AUC); rebalancear (oversampling/undersampling). Sempre olhar o recall da classe minoritária.", "id": "prog18"}, {"n": 19, "level": 2, "tag": "Entropia e ganho", "type": "open", "stem": "Uma fintech avalia 10 clientes de crédito: 5 pagam e 5 não. Dividindo por `tem_garantia`: **Sim** (4 clientes: 3 pagam, 1 não) e **Não** (6 clientes: 2 pagam, 4 não). Calcule a entropia do conjunto, a entropia de cada subgrupo e o **ganho de informação**. A divisão reduz a incerteza? (Use log₂; log₂(3) ≈ 1,585.)", "expl": "H(S) = −(0,5·log₂0,5 + 0,5·log₂0,5) = **1,0**. H(Sim: 3/4, 1/4) = −(0,75·log₂0,75 + 0,25·log₂0,25) ≈ **0,811**. H(Não: 2/6, 4/6) ≈ **0,918**. Ganho = 1,0 − (4/10·0,811 + 6/10·0,918) = 1,0 − (0,324 + 0,551) ≈ **0,125**. Sim, reduz a incerteza, mas pouco (ganho baixo). A árvore escolhe o atributo com **maior ganho** em cada nó.", "id": "prog19"}, {"n": 20, "level": 2, "tag": "KNN", "type": "open", "stem": "No projeto MAHLE, um KNN classifica modelos de veículos em dois segmentos usando duas features padronizadas (potência e preço). No plano, o segmento A (compactos) = {(1,1), (2,1)} e o segmento B (utilitários) = {(3,3), (4,4), (5,4)}. Classifique o ponto (2,2) com KNN para **k = 1, k = 3 e k = 5** (distância euclidiana). O que a mudança do resultado ilustra sobre o hiperparâmetro k? Por que padronizar as features antes do KNN?", "expl": "Distâncias de (2,2): (2,1)=1,00 A; (1,1)≈1,41 A; (3,3)≈1,41 B; (4,4)≈2,83 B; (5,4)≈3,61 B. **k=1**: A. **k=3**: vizinhos (2,1)A, (1,1)A, (3,3)B → **A** (2 a 1). **k=5**: todos os pontos → A:2, B:3 → **B**. O resultado muda com k: k pequeno é sensível a ruído; k grande perde detalhe local (chega a votar na classe majoritária). KNN é baseado em distância, logo variáveis em escalas maiores dominam; padronizar (StandardScaler) evita isso.", "id": "prog20"}, {"n": 21, "level": 3, "tag": "Métricas de regressão", "type": "open", "stem": "Um modelo de regressão prevê as vendas mensais de um segmento (em mil unidades). Valores reais y = [20, 30, 40, 50] e previsões ŷ = [20, 30, 43, 46]. Calcule MAE, MSE, RMSE e R². Por que o RMSE é maior que o MAE aqui e quando isso é desejável para o planejamento de produção? Quanto vale o R² de um modelo que sempre prevê a média?", "expl": "Erros: 0, 0, −3, 4. MAE = (0+0+3+4)/4 = **1,75**. MSE = (0+0+9+16)/4 = **6,25**. RMSE = **2,5**. R² = 1 − SSE/SST = 1 − 25/500 = **0,95** (média = 35; SST = 225+25+25+225). RMSE > MAE porque eleva erros ao quadrado, dando **mais peso a erros grandes**: desejável quando erros grandes são muito mais caros; indesejável se outliers de erro não são relevantes. Um modelo que sempre prevê a média tem **R² = 0**.", "id": "prog21"}, {"n": 22, "level": 3, "tag": "Overfitting e validação", "type": "open", "stem": "Um analista testou árvores de decisão para prever o segmento de compra:\n\n| max_depth | Acurácia treino | Acurácia teste |\n|---|---|---|\n| 2 | 0,70 | 0,68 |\n| 5 | 0,88 | 0,84 |\n| 12 | 1,00 | 0,71 |\n\n(a) Diagnostique cada linha (under/overfitting/bom ajuste). (b) Qual profundidade escolher? (c) Por que uma validação cruzada de 5 folds é mais confiável que um único hold-out, e o que a média e o desvio dos scores dizem?", "expl": "(a) depth 2: **underfitting** (baixo no treino e no teste). depth 5: **bom ajuste** (bom em ambos, gap pequeno). depth 12: **overfitting** (treino 1,00, teste 0,71). (b) **5**. (c) Hold-out depende de qual parte caiu em cada conjunto; K-Fold treina/testa em K partições e tira a média, então todo exemplo é testado. A **média** resume o desempenho esperado; o **desvio** mostra a estabilidade entre folds (custo computacional K vezes maior).", "id": "prog22"}, {"n": 23, "level": 3, "tag": "K-means e Elbow", "type": "open", "stem": "Uma montadora quer agrupar suas concessionárias em perfis de venda. A inércia do K-means para K = 1…6 foi `[900, 400, 150, 120, 105, 95]`. (a) Calcule a queda entre valores consecutivos. (b) Onde está o cotovelo? (c) Por que não escolher o K com menor inércia? (d) Como a silhueta complementa (interpretação de valores próximos de +1, 0 e negativos)?", "expl": "(a) Quedas: 500, 250, 30, 15, 10. (b) **K = 3**: depois dele o ganho passa a ser marginal. (c) A inércia sempre cai com K; K = n zeraria tudo (cada ponto é um cluster) — escolher o cotovelo (equilíbrio ganho × simplicidade). (d) Silhueta: perto de **+1** = bem agrupado e separado; ~**0** = na fronteira; **< 0** = provável ponto no grupo errado. Confirme com silhueta e sentido de negócio.", "id": "prog23"}, {"n": 24, "level": 3, "tag": "K-means", "type": "open", "stem": "Uma rede de academias quer segmentar alunos em perfis de comportamento sem usar rótulos. Explique passo a passo o algoritmo K-means (inicialização, atribuição, atualização, parada). Por que padronizar as variáveis e fixar `random_state`? O K-means é supervisionado ou não? Quem dá sentido aos grupos?", "expl": "(1) escolher K e iniciar centróides; (2) atribuir cada ponto ao centróide mais próximo; (3) recalcular centróides (média do grupo); (4) repetir 2–3 até os centróides quase não mudarem. Padronizar: a distância é sensível à escala. `random_state`: a inicialização é aleatória; fixar dá reprodutibilidade. É **não supervisionado** (só X, sem rótulo); o **sentido dos grupos vem da análise humana**.", "id": "prog24"}, {"n": 25, "level": 3, "tag": "Recomendação", "type": "open", "stem": "Um serviço de streaming monta a matriz usuário × filme (Duna, Matrix, Blade Runner, Titanic, Notebook, ET, Interestelar): Ana = [5,5,0,1,1,0,5]; Bruno = [0,5,5,0,0,4,4]; Carla = [1,0,0,5,5,0,0] (0 = não viu). (a) Calcule o cosseno Ana×Bruno e Ana×Carla. (b) Usando filtragem user-based com K = 1, o que recomendar à Ana e em que ordem? (c) Diferencie user-based de item-based e diga qual sofre mais com *cold start*.", "expl": "(a) Ana·Bruno = 25 + 20 = 45; |Ana| = √77 ≈ 8,77; |Bruno| = √82 ≈ 9,06 → cos ≈ **0,57**. Ana·Carla = 5 + 5 + 5 = 15; |Carla| = √51 ≈ 7,14 → cos ≈ **0,24**. (b) O vizinho mais próximo é o **Bruno**. Ana não viu Blade Runner (Bruno deu 5) nem ET (Bruno deu 4): recomendar **Blade Runner**, depois **ET**. (c) User-based: similaridade entre **usuários** (o que vizinhos gostaram); item-based: similaridade entre **itens** (parecido com o que você gostou), mais estável e escalável. O cold start (usuário/item novo sem histórico) atinge a **filtragem colaborativa** (ambas); o content-based/híbrido resolve.", "id": "prog25"}, {"n": 26, "level": 3, "tag": "ROC e PCA", "type": "open", "stem": "Usando a matriz de confusão da Q17 (inspeção de pistões: TP=30, FP=10, FN=20, TN=140): (a) calcule TPR e FPR, que formam um ponto da curva ROC. (b) O que significam AUC = 0,5 e AUC = 1,0? (c) Por que a curva usa `predict_proba` e não `predict`? (d) Ao aplicar PCA nas variáveis do projeto, por que padronizar antes, e o que `explained_variance_ratio_ = [0.62, 0.24]` diz? O que se perde?", "expl": "(a) TPR = recall = 30/50 = **0,60**; FPR = 10/150 ≈ **0,067**. (b) AUC 0,5 = aleatório; 1,0 = separação perfeita. (c) A ROC varia o limiar sobre um **score contínuo** (probabilidade da classe positiva); `predict` já devolve a classe (um ponto só). (d) O PCA é sensível à escala (variância domina), então padroniza-se antes. [0,62; 0,24] → 2 componentes explicam **86%** da variância. Perde-se parte da informação (14%) e a interpretabilidade das colunas originais (cada componente é combinação de variáveis).", "id": "prog26"}, {"n": 27, "level": 3, "tag": "Desbalanceamento", "type": "open", "stem": "Um modelo de detecção de fraude tem 9.400 exemplos da classe 0 (legítima) e 600 da classe 1 (fraude). (a) Qual o tamanho final com `RandomOverSampler`? E com `RandomUnderSampler`? (b) Um risco de cada. (c) Um colega aplicou o oversampling **antes** de separar treino e teste. O que está errado e como isso infla o resultado?", "expl": "(a) Over: 9.400 + 9.400 = **18.800**. Under: 600 + 600 = **1.200**. (b) Over: overfitting em exemplos repetidos. Under: perde informação relevante da classe majoritária. (c) Aplicar antes do split faz **cópias do mesmo exemplo caírem em treino e teste**: o modelo é testado em dados que já viu (vazamento) e a métrica fica inflada. Correto: separar primeiro e rebalancear **só o treino**.", "id": "prog27"}, {"n": 28, "level": 3, "tag": "Hiperparâmetros", "type": "open", "stem": "Uma equipe de ML ajusta um KNN para o projeto de vendas. (a) Diferencie parâmetro de hiperparâmetro (dois exemplos de cada). (b) `GridSearchCV` com `{'n_neighbors':[3,5,7,9], 'weights':['uniform','distance']}` e `cv=5`: quantos treinamentos? (c) `RandomizedSearchCV` com `n_iter=20` e `cv=5`: quantos? (d) Com 6 hiperparâmetros de 5 valores cada, quantas combinações tem a grade completa e qual busca usar?", "expl": "(a) **Parâmetro**: aprendido no treino (pesos, vieses, coeficientes). **Hiperparâmetro**: definido por você antes (k do KNN, `max_depth`, taxa de aprendizado, nº de árvores, C do SVM). (b) 4 × 2 = 8 combinações × 5 folds = **40** treinos. (c) 20 × 5 = **100** treinos. (d) 5⁶ = **15.625** combinações (× folds): inviável → **Random Search** (amostra n_iter combinações e costuma achar solução quase tão boa).", "id": "prog28"}, {"n": 29, "level": 3, "tag": "Pipeline e deploy", "type": "open", "stem": "Um modelo de previsão de demanda foi para produção com os erros abaixo. Encontre-os:\n```python", "expl": "Erros: (1) só o modelo foi salvo (o pré-processamento não vai junto); (2) em produção usou `fit_transform` (reaprende média/desvio do único registro; deveria ser só `transform`); (3) `cidade` (categórica) não foi tratada. Correção:\n```python\nct = ColumnTransformer([(\"num\", StandardScaler(), [\"idade\"]),\n                        (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), [\"cidade\"])])\npipe = Pipeline([(\"prep\", ct), (\"modelo\", RandomForestClassifier())])\npipe.fit(X_train, y_train)\njoblib.dump(pipe, \"pipeline_completo.joblib\")\n# produção\npipe = joblib.load(\"pipeline_completo.joblib\")\npipe.predict(novo)      # dados brutos; o pipeline cuida do resto\n```\n`pickle`: biblioteca padrão, serve para qualquer objeto, mais lento com muitos arrays NumPy. `joblib`: otimizado para arrays NumPy (modelos), recomendado pelo scikit-learn. Ambos podem não abrir em outra versão de Python/biblioteca.", "id": "prog29"}, {"n": 30, "level": 3, "tag": "Caso integrador", "type": "open", "stem": "Uma seguradora usa PyCaret (`setup`, `compare_models`, `tune_model`) para prever cancelamento e o modelo campeão tem 0,94 de acurácia. O time quer subir para produção. (a) Que cuidados (automation bias, métrica, custo do erro, desbalanceamento, validação)? (b) Para o cliente X, o SHAP tem valor base 0,30 e contribuições +0,25 (reclamações), −0,10 (tempo de casa), +0,05 (plano). Qual a probabilidade prevista? Qual variável mais pesou? Como isso difere da importância global? (c) Que papel o MLflow cumpre ao treinar várias versões (run, parâmetro, métrica, artefato)?", "expl": "(a) O AutoML **acelera**, não decide: compara métricas, não o contexto; não sabe o custo do erro nem se a métrica é a certa. *Automation bias* = confiar demais só porque veio de sistema automatizado. Verificar: métrica adequada (precisão × recall, F1), desbalanceamento (0,94 pode ser enganoso), validação cruzada/overfitting, explicabilidade, pipeline salvo junto com o modelo, teste com dados novos fora do notebook, monitoramento. (b) Predição = 0,30 + 0,25 − 0,10 + 0,05 = **0,50**. Mais peso: **reclamações** (+0,25, empurra para cima). SHAP explica **cada previsão individual** (valor base + contribuições = previsão); a importância global só diz o peso médio das variáveis no modelo. (c) MLflow (Tracking) registra **parâmetros** (max_depth), **métricas** (acurácia, F1), **artefatos** (modelo, gráficos) e tags de cada **run**, agrupadas em **experimentos**; permite comparar e reproduzir versões e saber qual configuração deu qual resultado (Model Registry versiona e promove modelos).", "id": "prog30"}]}, {"id": "lid", "name": "Liderança", "short": "Liderança", "c": "lid", "q": [{"n": 1, "level": 1, "tag": "Viés cognitivo", "type": "mc", "stem": "Na Sprint Review do projeto de previsão de vendas de veículos, o grupo percebe que sempre \"arredonda para cima\" as estimativas que confirmam o que o parceiro já espera. Segundo Kahneman (aula de Viés e IA), um viés cognitivo é:", "options": [["a", "uma falta de inteligência"], ["b", "um desvio sistemático de julgamento, que leva a conclusões distorcidas de forma previsível"], ["c", "um tipo de raciocínio lento e deliberado (Sistema 2)"], ["d", "um erro aleatório de julgamento, imprevisível"], ["e", "um defeito exclusivo de algoritmos"]], "answer": "b", "expl": "Viés = desvio **sistemático** (não aleatório), previsível. (c) é o Sistema 2.", "id": "lid1"}, {"n": 2, "level": 1, "tag": "Cegueira por desatenção", "type": "mc", "stem": "Ao analisar a base de emplacamentos do projeto, o time conta só as quedas de vendas por segmento e nem nota que a coluna `motorização` tem 30% de valores ausentes, mesmo estando à vista. Como no teste do gorila (Simons & Chabris, 1999), em que ~50% das pessoas não veem o gorila ao focar em contar passes, esse fenômeno é chamado de:", "options": [["a", "cegueira por desatenção"], ["b", "efeito halo"], ["c", "coded gaze"], ["d", "viés de ancoragem"], ["e", "viés de confirmação"]], "answer": "a", "expl": "Cegueira por desatenção. *Coded gaze* é o olhar de quem programou embutido na máquina (Buolamwini).", "id": "lid2"}, {"n": 3, "level": 1, "tag": "Viés em IA", "type": "mc", "stem": "Uma fintech treina um modelo de score de crédito e usa o **CEP** do cliente no lugar da renda; o CEP acaba carregando informação sobre raça e classe. Segundo Ferrara (2024), isso é um exemplo de viés:", "options": [["a", "de dados, por medição via proxy"], ["b", "de disponibilidade"], ["c", "de interação"], ["d", "algorítmico por limiar de corte"], ["e", "de confirmação do usuário"]], "answer": "a", "expl": "Viés de dados: amostragem torta, sub-representação, rótulos herdados e **medição por proxy** (CEP no lugar de renda). Algorítmico = escolhas de modelagem (função objetivo, variáveis, limiares); de interação = o sistema aprende com o uso (cliques, câmaras de eco).", "id": "lid3"}, {"n": 4, "level": 1, "tag": "Gender Shades", "type": "mc", "stem": "Um time de visão computacional audita sistemas comerciais de reconhecimento facial. No estudo *Gender Shades* (Buolamwini & Gebru, 2018), o erro chegou a 34,7% para mulheres de pele escura contra 0,8% para homens de pele clara. A causa central apontada foi:", "options": [["a", "falta de poder computacional"], ["b", "programadores mal-intencionados"], ["c", "excesso de dados de mulheres de pele escura"], ["d", "hardware de câmera inadequado"], ["e", "bases de treino dominadas por rostos claros e masculinos"]], "answer": "e", "expl": "Causa central: bases de treino dominadas por rostos claros e masculinos. O erro **não é igual para todos**.", "id": "lid4"}, {"n": 5, "level": 2, "tag": "Casos reais", "type": "mc", "stem": "A IA de triagem de currículos de uma big tech, treinada com 10 anos de contratações aprovadas, passou a penalizar currículos com a palavra \"women's\" (caso Amazon). Ao lado do caso COMPAS (risco de reincidência), a lição comum para quem constrói modelos é:", "options": [["a", "o viés só existe na interação com o usuário"], ["b", "o erro se resolve trocando o modelo por um mais complexo"], ["c", "ninguém programou o preconceito: ele veio dos dados históricos de decisões humanas passadas"], ["d", "os desenvolvedores programaram o preconceito no código"], ["e", "algoritmos são neutros por calcularem números"]], "answer": "c", "expl": "\"Ninguém programou o preconceito, ele veio pelos dados históricos.\" COMPAS: réus negros ~2x mais rotulados erroneamente como \"alto risco\" (ProPublica, 2016).", "id": "lid5"}, {"n": 6, "level": 2, "tag": "Personalidade e comportamento", "type": "mc", "stem": "Antes de dar feedback a um colega do grupo depois da sprint, você quer mirar no que de fato pode mudar. Sobre personalidade e comportamento nos slides de feedback:", "options": [["a", "personalidade = o que fazemos; comportamento = o que somos"], ["b", "rotular a pessoa abre caminho para mudança"], ["c", "feedback deve mirar a personalidade, pois ela explica tudo"], ["d", "personalidade = traços relativamente estáveis (o que somos); comportamento = ações observáveis num contexto (o que fazemos), e é o alvo do feedback"], ["e", "os dois são a mesma coisa"]], "answer": "d", "expl": "Personalidade = o que somos (estável); comportamento = o que fazemos (observável). Rotular a pessoa **fecha** a conversa; descrever o comportamento **abre** caminho.", "id": "lid6"}, {"n": 7, "level": 2, "tag": "Feedback SCI", "type": "mc", "stem": "Encontre S, C e I no feedback abaixo, dado na retrospectiva do projeto: *\"Na sprint review de terça, o colega não apresentou a parte dele do projeto; com isso, o grupo ficou sem os resultados e a nota do artefato caiu.\"*", "options": [["a", "S = o colega; C = a nota caiu; I = sprint review"], ["b", "Não há S, C e I nesse texto"], ["c", "S = não apresentou; C = grupo sem resultados; I = terça"], ["d", "S = a nota caiu; C = sprint review; I = não apresentou"], ["e", "S = sprint review de terça; C = não apresentou a sua parte; I = o grupo ficou sem resultados e a nota caiu"]], "answer": "e", "expl": "S = sprint review de terça; C = não apresentou a sua parte; I = grupo sem resultados e nota caiu. A \"intenção\" fecha com pedido/pergunta.", "id": "lid7"}, {"n": 8, "level": 3, "tag": "Feedback SCI", "type": "mc", "stem": "Um colega chega atrasado à daily do projeto e o grupo precisa refazer o status. Qual é o melhor feedback segundo SCI + Intenção e o checklist da aula (situação, comportamento observável, impacto, sem rótulo, fecha com pergunta/pedido)?", "options": [["a", "\"Na daily de quinta, você chegou 20 min atrasado; o grupo começou sem você e refizemos o status. Podemos combinar um aviso prévio quando houver imprevisto?\""], ["b", "\"Você é desorganizado e não se importa com o grupo.\""], ["c", "\"Seu código está uma bagunça.\""], ["d", "\"Você não se posiciona porque tem medo de conflito.\""], ["e", "\"Você deve continuar se aprofundando nos assuntos e trazer a prática para o dia a dia.\""]], "answer": "a", "expl": "Tem situação (daily de quinta), comportamento observável (chegou 20 min atrasado), impacto (grupo refez o status) e fecha com pedido. (b) rótulo; (c) só crítica, sem impacto; (d) julgamento embutido/psicanálise; (e) genérico demais.", "id": "lid8"}, {"n": 9, "level": 3, "tag": "Comunicação Não Violenta", "type": "mc", "stem": "Ao preparar um feedback sobre a documentação do repositório do projeto, o grupo decide usar a Comunicação Não Violenta. Os quatro componentes da CNV, na ordem, são:", "options": [["a", "julgamento → sentimento → necessidade → exigência"], ["b", "sentimento → observação → pedido → necessidade"], ["c", "situação → comportamento → impacto → intenção"], ["d", "observação → sentimento → necessidade → pedido"], ["e", "pedido → observação → necessidade → sentimento"]], "answer": "d", "expl": "Observar sem julgar → descrever sentimentos → apontar necessidade → fazer um pedido. (c) é o SCI + Intenção.", "id": "lid9"}, {"n": 10, "level": 3, "tag": "Papel do líder", "type": "mc", "stem": "A diretoria de uma empresa adota um modelo preditivo de risco e passa a aceitar as saídas sem revisar, porque \"o algoritmo calcula, logo é neutro\". Segundo a aula de Viés e IA, a afirmação mais correta sobre o papel do líder é:", "options": [["a", "o líder só precisa corrigir vieses de interação, não de dados"], ["b", "a IA elimina o Sistema 1, então o líder deve apenas seguir a saída do modelo"], ["c", "viés e injustiça (bias e fairness) são sinônimos"], ["d", "a IA \"industrializa\" o Sistema 1 (viés individual vira sistemático e em escala); o líder deve ser o Sistema 2 da organização: auditar, questionar, desacelerar"], ["e", "como o algoritmo calcula, ele é racional e neutro"]], "answer": "d", "expl": "\"A IA não elimina o Sistema 1, ela o industrializa.\" O líder é o Sistema 2 da organização. Bias (desvio) ≠ fairness (justiça).", "id": "lid10"}]}, {"id": "neg", "name": "Negócios", "short": "Negócios", "c": "neg", "q": [{"n": 1, "level": 1, "tag": "SWOT", "type": "mc", "stem": "No projeto de previsão de vendas de veículos da MAHLE (fornecedora Tier 1 de autopeças), o grupo monta a SWOT. A oscilação do **câmbio**, que encarece componentes importados, é:", "options": [["a", "não entra na SWOT"], ["b", "força"], ["c", "ameaça (fator externo que a empresa não controla)"], ["d", "oportunidade"], ["e", "fraqueza"]], "answer": "c", "expl": "SWOT: \"A MAHLE controla isso?\" Se sim, força/fraqueza; se não, oportunidade/ameaça. Câmbio não é fraqueza, é **ameaça do ambiente**.", "id": "neg1"}, {"n": 2, "level": 1, "tag": "Seção 1 do artefato", "type": "mc", "stem": "Na Seção 1 do artefato do projeto (parceiro e problema), o grupo escreve sobre a MAHLE. O texto deve:", "options": [["a", "ser genérico para servir a qualquer fornecedora"], ["b", "copiar o texto institucional do site do parceiro"], ["c", "descrever o problema (com efeito operacional e fonte dos números), e não antecipar a solução"], ["d", "usar adjetivos como \"grande\" e \"líder\" no lugar de dados"], ["e", "apresentar a solução de IA logo no primeiro parágrafo"]], "answer": "c", "expl": "Seção 1 = quem é, porte/região, área, problema com efeito operacional e fonte de cada número. Derruba a nota: texto copiado, adjetivo no lugar de dado, antecipar solução, sintoma por causa.", "id": "neg2"}, {"n": 3, "level": 1, "tag": "Concorrentes", "type": "mc", "stem": "Ao mapear o mercado de autopeças para as 5 Forças de Porter do projeto, o grupo lista concorrentes da MAHLE. Segundo o slide, os **concorrentes** são aqueles que:", "options": [["a", "fornecem matéria-prima para a MAHLE"], ["b", "a montadora escolheria se a MAHLE não existisse (ex.: BorgWarner, Denso, Valeo, Bosch, fabricantes chineses)"], ["c", "são qualquer empresa do setor automotivo"], ["d", "distribuem produtos sem vender à montadora"], ["e", "são apenas as montadoras clientes"]], "answer": "b", "expl": "\"Concorrente é quem a montadora escolheria se a MAHLE não existisse.\" Fornecedor de matéria-prima **não** é concorrente; distribuidor só entra se vender direto à montadora.", "id": "neg3"}, {"n": 4, "level": 1, "tag": "Critério de sucesso", "type": "mc", "stem": "Na Seção 4.1.3 do artefato do projeto de previsão de demanda, o grupo precisa definir o **critério de sucesso** da solução. Ele deve ser:", "options": [["a", "somente a acurácia do modelo"], ["b", "uma opinião sobre a qualidade do modelo"], ["c", "a satisfação do grupo"], ["d", "somente a queda de custos, sem métrica de modelo"], ["e", "o par métrica do modelo (erro de previsão vs realizado) + métrica de negócio (menos ajustes emergenciais de produção, estoque no planejado)"]], "answer": "e", "expl": "Critério de sucesso não é opinião: métrica do modelo (erro de previsão, comparação com regra simples) **e** métrica de negócio. \"Um modelo com erro baixo que ninguém usa não resolve o problema.\"", "id": "neg4"}, {"n": 5, "level": 2, "tag": "LGPD", "type": "mc", "stem": "No repositório do projeto, alguém propõe manter na base colunas que não entram no modelo \"só por garantia\". Segundo os princípios da LGPD aplicados ao projeto, \"**coluna que não entra no modelo não deveria estar na base**\" corresponde ao princípio da:", "options": [["a", "responsabilização"], ["b", "transparência"], ["c", "segurança"], ["d", "necessidade"], ["e", "finalidade"]], "answer": "d", "expl": "Necessidade: só o que o modelo precisa. Finalidade: uso só para prever demanda. Segurança: repositório privado. Transparência: o parceiro sabe o que se faz. Responsabilização: demonstrar que seguiu as regras.", "id": "neg5"}, {"n": 6, "level": 2, "tag": "Paradoxos de Pisano", "type": "mc", "stem": "A MAHLE decide majoritariamente por experiência, mas o time do modelo preditivo quer testar hipóteses novas com dados, com hipóteses claras, testes bem desenhados e critério objetivo para parar ou pivotar. Isso equilibra, em Pisano (HBR, 2019), o paradoxo:", "options": [["a", "colaboração × responsabilidade individual"], ["b", "tolerância à falha × intolerância à incompetência"], ["c", "não-hierarquia × liderança forte"], ["d", "segurança psicológica × candura brutal"], ["e", "experimentação × disciplina rigorosa"]], "answer": "e", "expl": "Experimentação (testar hipóteses) × **disciplina** (hipóteses claras, testes bem desenhados, critério para parar/pivotar). Sem disciplina, vira caos sem aprendizado.", "id": "neg6"}, {"n": 7, "level": 2, "tag": "Cultura (Schein)", "type": "mc", "stem": "Ao observar a MAHLE, o grupo nota o jargão, o forecast comunicado em planilhas mensais e as reuniões de planejamento. Em Schein (cap. 1), sobre os níveis de cultura:", "options": [["a", "cultura é apenas uma lista de traços, sem processo dinâmico"], ["b", "artefatos observáveis são a base estável e inconsciente da cultura"], ["c", "premissas básicas são fáceis de observar e fáceis de mudar"], ["d", "cultura muda facilmente com a chegada de novos membros, inclusive seu núcleo"], ["e", "artefatos (jargão, rituais, valores expostos) são visíveis mas difíceis de interpretar sozinhos; as premissas básicas são o DNA cultural: estáveis, inconscientes e difíceis de mudar"]], "answer": "e", "expl": "Artefatos: visíveis, difíceis de interpretar sozinhos. Premissas básicas: DNA cultural, estáveis, inconscientes, difíceis de mudar sem que o grupo se desmantele.", "id": "neg7"}, {"n": 8, "level": 3, "tag": "Mudança (Schein)", "type": "mc", "stem": "O time da MAHLE que faz a previsão manual teme perder competência e status com a chegada do modelo preditivo. Segundo Schein (cap. 16), o que o time de projeto **deve** fazer, e em qual estágio da mudança?", "options": [["a", "culpar outro departamento (bode expiatório)"], ["b", "reduzir a ansiedade pela aprendizagem (treinamento, envolvimento do aprendiz, tempo/prática/feedback) e criar segurança psicológica; estágio de descongelamento"], ["c", "ignorar a resistência e impor o modelo"], ["d", "esperar o recongelamento antes de qualquer ação"], ["e", "aumentar a ansiedade pela sobrevivência; estágio de recongelamento"]], "answer": "b", "expl": "Princípio-chave (Schein): reduzir a ansiedade pela **aprendizagem** é mais eficaz do que aumentar a ansiedade pela sobrevivência. Descongelamento → mudança → recongelamento; as 8 condições de segurança psicológica (visão positiva, treinamento, envolvimento do aprendiz, grupos familiares, recursos/tempo/feedback, modelos, grupos de apoio, remoção de barreiras). (a) é uma forma de **resistência** (bode expiatório), como negação e manobra/barganha.", "id": "neg8"}, {"n": 9, "level": 3, "tag": "Governança", "type": "mc", "stem": "Uma startup de IA (spin-off de um laboratório) quer estruturar a governança antes de captar investimento. Na governança corporativa para startups, os **4 princípios fundamentais** são:", "options": [["a", "lucro, escala, velocidade e inovação"], ["b", "transparência, equidade, prestação de contas (*accountability*) e responsabilidade corporativa"], ["c", "estratégia, pessoas, tecnologia e processos"], ["d", "visão, missão, valores e metas"], ["e", "ideação, validação, tração e escala"]], "answer": "b", "expl": "Princípios: transparência, equidade, prestação de contas, responsabilidade corporativa. (c) são os **4 pilares** (estratégia & sociedade; pessoas & recursos; tecnologia & propriedade; processos & accountability); (e) são as **4 fases** do ciclo de vida.", "id": "neg9"}, {"n": 10, "level": 3, "tag": "Governança: ciclo de vida", "type": "mc", "stem": "Uma startup de análise preditiva já validou o produto (*product-market fit*) e cresce rápido, mas decide tudo de modo informal. Na fase **Tração**, o slide recomenda como práticas essenciais:", "options": [["a", "conselho de administração formal, comitês temáticos (auditoria, compliance), planejamento estratégico estruturado, controles internos e políticas de compliance/ética"], ["b", "apenas o Founders Agreement e o código de conduta inicial"], ["c", "constituição formal da empresa e primeiros clientes"], ["d", "auditoria externa total, conselho independente e preparação para IPO/M&A"], ["e", "nenhuma prática formal, para preservar a agilidade"]], "answer": "a", "expl": "Ideação: Founders Agreement, participações, código de conduta, PI. Validação: constituição formal, estatuto, conselho consultivo, primeiro investimento. **Tração: conselho de administração formal, comitês, planejamento, controles internos, compliance.** Escala: conselho independente, auditoria externa, preparação para IPO/M&A. Desafio da tração: crescer sem perder agilidade.", "id": "neg10"}]}, {"id": "des", "name": "Design", "short": "Design", "c": "des", "q": [{"n": 1, "level": 1, "tag": "CRISP-DM e UX", "type": "mc", "stem": "No projeto de previsão de demanda da MAHLE, o grupo mapeia onde a experiência do usuário decide o sucesso do modelo. No CRISP-DM, a fase em que \"as pessoas encontram o modelo\" é:", "options": [["a", "Data Preparation"], ["b", "Data Understanding"], ["c", "Modeling"], ["d", "Deployment"], ["e", "Business Understanding"]], "answer": "d", "expl": "No CRISP-DM, o *Deployment* é onde as pessoas encontram o modelo; sem alguém para usar a previsão, o ciclo recomeça.", "id": "des1"}, {"n": 2, "level": 1, "tag": "IA e UX", "type": "mc", "stem": "Um squad avalia se deve usar IA em várias funcionalidades do produto. Segundo o Google PAIR (autoestudo), a IA **não** é a melhor opção quando:", "options": [["a", "é preciso estimar valores futuros"], ["b", "há erros críticos (alto custo de falha) ou necessidade de transparência/explicabilidade total"], ["c", "o objetivo é personalizar recomendações"], ["d", "há padrões a reconhecer em imagens"], ["e", "é preciso detectar anomalias"]], "answer": "b", "expl": "Boa opção: personalização, previsões, reconhecimento, anomalias, automação. **Não** é a melhor: previsibilidade, dados estáticos, erros críticos, transparência total, rapidez e custo.", "id": "des2"}, {"n": 3, "level": 1, "tag": "Stakeholders", "type": "mc", "stem": "No caso MAHLE, o **planejador de demanda** usa a previsão diretamente, o **diretor de operações** decide capacidade com base nela e o **planejador de produção** apenas recebe o forecast e programa a linha. Eles são, respectivamente:", "options": [["a", "nenhum deles é stakeholder"], ["b", "usuário afetado, usuário afetado, usuário primário"], ["c", "todos usuários primários"], ["d", "usuário primário, usuário secundário, usuário afetado"], ["e", "usuário secundário, usuário primário, usuário afetado"]], "answer": "d", "expl": "Planejador de demanda = usuário primário; diretor de operações = secundário; planejador de produção e comprador = **afetados** (não decidem a previsão, mas sofrem as consequências).", "id": "des3"}, {"n": 4, "level": 1, "tag": "Jornada do usuário", "type": "mc", "stem": "O grupo monta o mapa de jornada do planejador de demanda da MAHLE (revisão mensal da previsão). Sobre o mapa de jornada (NN/g, aula 2):", "options": [["a", "um mapa pode ter várias personas ao mesmo tempo"], ["b", "a jornada não inclui emoções"], ["c", "1 mapa = 1 ator + 1 ponto de vista (com cenário/expectativas, fases, ações/pensamentos/emoções e oportunidades); duas personas exigem dois mapas"], ["d", "as ações vêm da mesa de trabalho da equipe, sem pesquisa"], ["e", "o mapa termina nas ações, sem oportunidades"]], "answer": "c", "expl": "\"Provide one point of view per map.\" Partes: ator/persona, cenário + expectativas, fases, ações/pensamentos/emoções, oportunidades. As ações vêm de pesquisa e conversa com o parceiro, **não da mesa**.", "id": "des4"}, {"n": 5, "level": 2, "tag": "Gráficos: feio, ruim, errado", "type": "mc", "stem": "Numa review do projeto, três versões de um gráfico de barras de vendas por segmento aparecem: (1) cada barra com sua própria escala, parecendo iguais; (2) barra do valor 4 mais alta que a do valor 5; (3) uma cor por barra, três fontes e grade demais. Classificando em **feio / ruim / errado**:", "options": [["a", "as três são \"errado\""], ["b", "1 = feio; 2 = ruim; 3 = errado"], ["c", "1 = ruim (percepção); 2 = errado (matemática); 3 = feio (estética)"], ["d", "1 = errado; 2 = feio; 3 = ruim"], ["e", "1 = errado; 2 = ruim; 3 = feio"]], "answer": "c", "expl": "**Feio** = estética (excesso; alturas certas). **Ruim** = percepção (escalas diferentes por barra: números certos, percepção errada). **Errado** = matemática (comprimento não corresponde ao valor).", "id": "des5"}, {"n": 6, "level": 2, "tag": "Escolha do gráfico", "type": "mc", "stem": "Um dashboard de uma rede de academias precisa responder: (i) \"como a frequência evoluiu ao longo dos meses?\", (ii) \"existe relação entre frequência de treino e gasto mensal?\", (iii) \"como as idades dos alunos se distribuem?\". Qual gráfico responde melhor a cada uma?", "options": [["a", "(i) histograma; (ii) barras; (iii) linha"], ["b", "(i) linha; (ii) dispersão; (iii) histograma"], ["c", "(i) pizza; (ii) histograma; (iii) dispersão"], ["d", "(i) barras; (ii) linha; (iii) pizza"], ["e", "(i) dispersão; (ii) linha; (iii) barras empilhadas"]], "answer": "b", "expl": "Tendência → linha; comparação → barras; composição → barras empilhadas; relação → dispersão; distribuição → histograma. Comece pela pergunta (\"o que precisamos enxergar?\"), não pelo gráfico.", "id": "des6"}, {"n": 7, "level": 2, "tag": "Boas práticas", "type": "mc", "stem": "Ao preparar os gráficos do relatório de previsão de vendas para a diretoria, sobre boas práticas:", "options": [["a", "em barras o eixo começa no zero (o comprimento codifica o valor); no histograma as barras se tocam (faixas numéricas); no gráfico de linha o eixo Y não precisa começar em zero"], ["b", "barras de histograma devem ter espaço entre si, como no gráfico de barras"], ["c", "em dispersão devem-se ligar os pontos com linhas"], ["d", "o eixo do gráfico de barras pode começar em qualquer valor, pois só a diferença importa"], ["e", "pizza é ideal para comparar muitas categorias"]], "answer": "a", "expl": "Barras: eixo no zero. Histograma: barras se tocam; a largura dos intervalos muda o que enxergamos (não os dados). Linha: eixo Y não precisa começar em zero. Dispersão: **não ligue os pontos**. Pizza: um único todo, poucas categorias.", "id": "des7"}, {"n": 8, "level": 3, "tag": "Correlação e causa", "type": "mc", "stem": "O gráfico de dispersão de uma academia mostra que, quanto mais o time posta nas redes, mais matrículas há. O gerente quer aumentar os posts para vender mais. Com base na aula, a leitura correta é:", "options": [["a", "a relação é causal se o R² for alto"], ["b", "é preciso ligar os pontos para provar causa"], ["c", "existe relação (direção, concentração, extremos), mas duas variáveis variarem juntas não significa que uma causa a outra; pode haver terceira variável (ex.: sazonalidade), como nas *Spurious Correlations*"], ["d", "o post causa as matrículas"], ["e", "não há relação, pois há pontos dispersos"]], "answer": "c", "expl": "Dispersão: observe direção, concentração e extremos. **Relação não significa causalidade**; pergunte sempre se há uma terceira variável.", "id": "des8"}, {"n": 9, "level": 3, "tag": "Storytelling", "type": "mc", "stem": "Na apresentação do modelo de previsão à diretoria, o slide mostra: \"Acurácia geral: 82%. No segmento crítico: 61%.\" Segundo a aula de Storytelling com Dados, isso é um dado. A **mensagem** correspondente e a melhor forma de conduzir a atenção são:", "options": [["a", "a mensagem é o próprio dado; basta mostrar o gráfico completo"], ["b", "a mensagem só deve aparecer no final, sem destaque"], ["c", "a mensagem é \"acurácia é 82%\"; o título deve descrever o eixo"], ["d", "não existe diferença entre dado e mensagem"], ["e", "\"O modelo acerta no geral, mas falha no segmento mais crítico.\" O título deve comunicar a mensagem, a cor aponta, o texto explica e a conclusão fica escrita (não a cargo do leitor)"]], "answer": "e", "expl": "\"Dado não é mensagem.\" Cor aponta, texto explica; conclusão escrita; o título comunica a mensagem (não descreve o eixo).", "id": "des9"}, {"n": 10, "level": 3, "tag": "Storyboard", "type": "mc", "stem": "O grupo monta o storyboard de apresentação final do projeto com as Reviews das Sprints 1 a 4. A melhor estrutura e o cuidado central (aula 4) são:", "options": [["a", "contexto → questão/tensão → evidências → significado → encaminhamento; a sequência da história parte do que o público precisa saber para compreender o que vem depois (não da ordem do projeto); teste trocar, retirar e depender de quadros; nenhum quadro sem função"], ["b", "começar sempre pela coleta de dados"], ["c", "mostrar todos os 70 indicadores de uma vez, para completude"], ["d", "evitar qualquer teste de leitura por outro grupo"], ["e", "seguir a ordem cronológica das Reviews, pois \"o caminho de quem fez\" é o caminho de quem precisa compreender"]], "answer": "a", "expl": "Estrutura: contexto → questão/tensão → evidências → significado → encaminhamento. \"O caminho linear da análise é o caminho de quem fez, não de quem precisa compreender\" (Knaflic). Testes: trocar, retirar, depender; cinco testes finais (propósito, evidência, sequência, atenção, corte) e teste de leitura por outro grupo.", "id": "des10"}]}]</script>
<script>
(function(){
var SUBJ=JSON.parse(document.getElementById('data').textContent);
var LVL=["","Fácil","Média","Difícil"];
var INTRO={
 mat:"Questões de soma (01, 02, 04) e múltipla escolha. Sem calculadora, como na prova. Tabela normal padrão nos materiais da matéria.",
 prog:"Responda por escrito, como na prova de recuperação. Depois abra a resposta-modelo e se avalie com honestidade.",
 lid:"Viés e IA, feedback SCI e comunicação não violenta.",
 neg:"Projeto MAHLE (SWOT, Porter, LGPD), cultura e mudança, governança de startups.",
 des:"UX de modelos preditivos, jornada, visualização de dados e storytelling."
};
var st={tab:"mat",filter:"all",ans:{}};
var KEY="simulado-m3-v1";
try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.ans){st=s}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* markdown mínimo */
function inline(s){
  var codes=[];
  s=esc(s).replace(/`([^`]+)`/g,function(_,c){codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  return s.replace(/\u0000(\d+)\u0000/g,function(_,i){return "<code>"+codes[i]+"</code>"});
}
function md(src){
  var lines=src.split("\n"),out=[],i=0,para=[];
  function flush(){if(para.length){out.push("<p>"+inline(para.join(" "))+"</p>");para=[]}}
  while(i<lines.length){
    var l=lines[i];
    if(/^```/.test(l)){flush();var buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++}i++;out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");continue}
    if(/^\|/.test(l)){flush();var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++}
      var h="<div class=scroll><table>";rows.forEach(function(r,ix){if(/^\|[\s:|-]+\|$/.test(r))return;var c=r.replace(/^\||\|$/g,"").split("|");var tg=ix===0?"th":"td";h+="<tr>"+c.map(function(x){return "<"+tg+">"+inline(x.trim())+"</"+tg+">"}).join("")+"</tr>"});
      out.push(h+"</table></div>");continue}
    if(/^\s*-\s+/.test(l)){flush();var li=[];while(i<lines.length&&/^\s*-\s+/.test(lines[i])){li.push("<li>"+inline(lines[i].replace(/^\s*-\s+/,""))+"</li>");i++}out.push("<ul>"+li.join("")+"</ul>");continue}
    if(/^\s*$/.test(l)){flush();i++;continue}
    para.push(l.trim());i++;
  }
  flush();return out.join("");
}

/* estado */
function get(q){return st.ans[q.id]||(st.ans[q.id]={})}
function status(q){ // ok | mid | bad | null
  var a=st.ans[q.id];if(!a)return null;
  if(q.type==="open")return a.grade||null;
  return a.done?a.res:null;
}
function score(q){var s=status(q);return s==="ok"?1:s==="mid"?.5:0}
function subj(){return SUBJ.filter(function(s){return s.id===st.tab})[0]}
function shortName(s){return s.short}

/* cabeçalho */
function renderHead(){
  var tot=0,dn=0,pts=0;
  SUBJ.forEach(function(s){s.q.forEach(function(q){tot++;var x=status(q);if(x){dn++;pts+=score(q)}})});
  $("ovBar").style.width=(dn/tot*100)+"%";
  $("ovTxt").textContent=dn+" de "+tot+" feitas"+(dn?" · "+Math.round(pts/dn*100)+"% de acerto":"");
  var t=$("tabs");t.innerHTML="";
  SUBJ.forEach(function(s){
    var d=0,p=0;s.q.forEach(function(q){var x=status(q);if(x){d++;p+=score(q)}});
    var b=document.createElement("button");b.type="button";b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",s.id===st.tab);b.style.setProperty("--c","var(--"+s.c+")");
    b.innerHTML="<b>"+s.name+"</b><small>"+d+"/"+s.q.length+(d?" · "+Math.round(p/d*100)+"%":"")+"</small><div class=bar><i style=\"width:"+(d/s.q.length*100)+"%\"></i></div>";
    b.onclick=function(){st.tab=s.id;save();renderAll();window.scrollTo({top:0})};
    t.appendChild(b);
  });
}
function renderChips(){
  var s=subj(),c=$("chips");c.innerHTML="";c.style.setProperty("--c","var(--"+s.c+")");
  [["all","Todas"],["1","Fácil"],["2","Média"],["3","Difícil"],["pend","Pendentes"],["bad","Erradas"]].forEach(function(f){
    var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=f[1];b.setAttribute("aria-pressed",st.filter===f[0]);
    b.onclick=function(){st.filter=f[0];save();renderChips();renderList()};c.appendChild(b);
  });
  $("intro").innerHTML="<strong>"+s.name+" · "+s.q.length+" questões.</strong> "+INTRO[s.id];
}

/* cartões */
function lvlHTML(n){return "<div class=lvl title=\""+LVL[n]+"\"><i class=\""+(n>=1?"on":"")+"\"></i><i class=\""+(n>=2?"on":"")+"\"></i><i class=\""+(n>=3?"on":"")+"\"></i><span>"+LVL[n]+"</span></div>"}
function kindLbl(q){return q.type==="mc"?"Múltipla escolha":q.type==="soma"?"Soma":"Dissertativa"}
function renderList(){
  var s=subj(),list=$("list");list.innerHTML="";
  var qs=s.q.filter(function(q){
    var x=status(q);
    if(st.filter==="all")return true;
    if(st.filter==="pend")return !x;
    if(st.filter==="bad")return x==="bad"||x==="mid";
    return String(q.level)===st.filter;
  });
  if(!qs.length){list.innerHTML="<div class=empty>Nada por aqui neste filtro.</div>";return}
  qs.forEach(function(q){list.appendChild(card(s,q))});
}
function card(s,q){
  var a=get(q),x=status(q),el=document.createElement("article");
  el.className="card"+(x?" done-"+x:"");el.style.setProperty("--c","var(--"+s.c+")");el.id=q.id;
  var h="<div class=qhead><span class=num>"+q.n+"</span><span class=tag>"+esc(q.tag)+"</span><span class=kind>"+kindLbl(q)+"</span>"+lvlHTML(q.level)+"</div><div class=stem>"+md(q.stem)+"</div>";
  el.innerHTML=h;
  var body=document.createElement("div");body.style.display="grid";body.style.gap="12px";el.appendChild(body);
  if(q.type==="mc")mcBody(q,a,body);else if(q.type==="soma")somaBody(q,a,body);else openBody(q,a,body);
  return el;
}
function redo(q){delete st.ans[q.id];save();renderHead();renderList()}
function fbHTML(cls,verdict,expl,extra){
  return "<div class=\"fb "+cls+"\"><div class=verdict>"+verdict+"</div>"+(extra||"")+"<div class=expl>"+md(expl)+"</div><div><button type=button class=ghost data-redo>Refazer</button></div></div>";
}
function mcBody(q,a,body){
  var box=document.createElement("div");box.className="opts";
  q.options.forEach(function(o){
    var b=document.createElement("button");b.type="button";b.className="opt";
    b.innerHTML="<span class=k>"+o[0]+"</span><span class=t>"+inline(o[1])+"</span>";
    if(a.done){b.disabled=true;
      if(o[0]===q.answer)b.classList.add("right");else if(o[0]===a.sel)b.classList.add("wrong");else b.classList.add("dim")}
    b.onclick=function(){a.sel=o[0];a.done=true;a.res=(o[0]===q.answer)?"ok":"bad";save();renderHead();renderList();var e=document.getElementById(q.id);if(e&&e.scrollIntoView)e.scrollIntoView({block:"nearest"})};
    box.appendChild(b);
  });
  body.appendChild(box);
  if(a.done){var w=document.createElement("div");
    w.innerHTML=fbHTML(a.res==="ok"?"ok":"bad",a.res==="ok"?"Correto":"Errou. A certa é a "+q.answer.toUpperCase(),q.expl);
    body.appendChild(w.firstChild);body.querySelector("[data-redo]").onclick=function(){redo(q)}}
}
function somaBody(q,a,body){
  a.picks=a.picks||[];
  var box=document.createElement("div");box.className="soma";
  q.items.forEach(function(it){
    var on=a.picks.indexOf(it[0])>=0,b=document.createElement("button");b.type="button";b.className="st";b.setAttribute("aria-pressed",on);
    b.innerHTML="<span class=v>"+("0"+it[0]).slice(-2)+"</span><span class=t>"+inline(it[1])+"</span>";
    if(a.done){var truth=(q.answer&it[0])!==0;b.disabled=true;
      b.classList.add(on===truth?"right":"wrong");
      b.insertAdjacentHTML("beforeend","<span class=mark>"+(truth?"Afirmação correta":"Afirmação falsa")+(on===truth?"":(truth?" · você deixou de marcar":" · você marcou"))+"</span>")}
    b.onclick=function(){if(a.done)return;var i=a.picks.indexOf(it[0]);if(i>=0)a.picks.splice(i,1);else a.picks.push(it[0]);save();renderList()};
    box.appendChild(b);
  });
  body.appendChild(box);
  var cur=a.picks.reduce(function(x,y){return x+y},0);
  if(!a.done){
    var r=document.createElement("div");r.className="row";
    r.innerHTML="<span class=sum>Soma: <b>"+cur+"</b></span><button type=button class=btn>Conferir</button>";
    r.querySelector("button").onclick=function(){
      var diff=cur^q.answer,bits=(diff&1)+((diff>>1)&1)+((diff>>2)&1);
      a.done=true;a.sum=cur;a.res=bits===0?"ok":(bits===1?"mid":"bad");save();renderHead();renderList()};
    body.appendChild(r);
  }else{
    var bits=(function(){var d=a.sum^q.answer;return (d&1)+((d>>1)&1)+((d>>2)&1)})();
    var cls=a.res==="ok"?"ok":a.res==="mid"?"mid":"bad";
    var vt=a.res==="ok"?"Correto: soma "+q.answer:(a.res==="mid"?"Quase. Um único erro (vale 0,7 na prova). A soma certa é "+q.answer:"Errou. Você marcou "+a.sum+"; a soma certa é "+q.answer);
    var w=document.createElement("div");w.innerHTML=fbHTML(cls,vt,q.expl);
    body.appendChild(w.firstChild);body.querySelector("[data-redo]").onclick=function(){redo(q)};
  }
}
